NotificationUserSnippet:
  type: object
  description: Minimal user info embedded inside a notification.
  properties:
    userId:
      type: string
      example: 'usr_001'
    displayName:
      type: string
      example: 'Jane Smith'
    avatarUrl:
      type: string
      format: uri
      example: 'https://cdn.example.com/avatars/usr_001.jpg'
  required:
    - userId
    - displayName

NotificationActivityType:
  type: string
  description: |
    Notification activity type.
    - track_liked: someone liked a track
    - track_commented: someone commented on a track
    - user_mentioned: someone mentioned a user in a comment
    - track_reposted: someone reposted a track
    - user_followed: someone followed a user
    - new_track: a followed user posted a new track
  enum:
    - track_liked
    - track_commented
    - user_mentioned
    - track_reposted
    - user_followed
    - new_track

NotificationTargetTrack:
  type: object
  description: Target object for track-based notifications (like, repost, new track).
  properties:
    targetType:
      type: string
      enum:
        - track
      example: track
    targetId:
      type: string
      description: Track id.
      example: trk_456
    title:
      type: string
      description: Track title.
      example: My Awesome Track
  required:
    - targetType
    - targetId

NotificationTargetComment:
  type: object
  description: Target object for comment and mention notifications.
  properties:
    targetType:
      type: string
      enum:
        - comment
      example: comment
    targetId:
      type: string
      description: Comment id.
      example: cmt_321
    trackId:
      type: string
      description: Track id the comment belongs to.
      example: trk_456
    commentText:
      type: string
      description: Comment text payload.
      example: Great track!
    mentionedUserProfileLink:
      type: string
      description: Mentioned user profile link when activityType is user_mentioned.
      example: jane-smith-ab12c
  required:
    - targetType
    - targetId

NotificationTargetUser:
  type: object
  description: Target object for follow notifications.
  properties:
    targetType:
      type: string
      enum:
        - user
      example: user
    targetId:
      type: string
      description: Followed user id.
      example: usr_999
  required:
    - targetType
    - targetId

NotificationTarget:
  description: Target payload shape depends on activityType.
  oneOf:
    - $ref: '#/components/schemas/NotificationTargetTrack'
    - $ref: '#/components/schemas/NotificationTargetComment'
    - $ref: '#/components/schemas/NotificationTargetUser'

NotificationDTO:
  type: object
  description: |
    A single notification delivered to a user.
    The activityType value determines the target shape and additional fields.
  properties:
    notificationId:
      type: string
      example: 'ntf_789'
    to:
      type: string
      description: The userId of the notification recipient.
      example: 'usr_001'
    read:
      type: boolean
      example: false
    activityType:
      $ref: '#/components/schemas/NotificationActivityType'
    actor:
      $ref: '#/components/schemas/NotificationUserSnippet'
    target:
      $ref: '#/components/schemas/NotificationTarget'
    createdAt:
      type: string
      format: date-time
      example: '2025-01-15T12:00:00Z'
  required:
    - notificationId
    - to
    - read
    - activityType
    - actor
    - target
    - createdAt

NotificationListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 75
    offset:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    notifications:
      type: array
      items:
        $ref: '#/components/schemas/NotificationDTO'
  required:
    - total
    - offset
    - limit
    - notifications

UnreadCountResponse:
  type: object
  properties:
    unreadCount:
      type: integer
      example: 5
  required:
    - unreadCount

MarkReadResponse:
  type: object
  properties:
    notificationId:
      type: string
      example: 'ntf_789'
    read:
      type: boolean
      example: true
    unreadCount:
      type: integer
      example: 4
  required:
    - notificationId
    - read
    - unreadCount
