# PATCH paths for notifications module

/api/notifications/v1/read-all:
  patch:
    tags:
      - Notifications
    summary: Mark all notifications as read.
    description: Sets read to true on every unread notification belonging to the authenticated user and returns the updated unread count.
    operationId: markAllNotificationsRead
    responses:
      200:
        description: All notifications marked as read.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnreadCountResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      500:
        $ref: '#/components/responses/ServerError'

/api/notifications/v1/{notificationId}/read:
  patch:
    tags:
      - Notifications
    summary: Mark a single notification as read.
    description: Sets read to true on the specified notification (if it belongs to the authenticated user) and returns the updated unread count.
    operationId: markNotificationRead
    parameters:
      - $ref: '#/components/parameters/NotificationIdParam'
    responses:
      200:
        description: Notification marked as read.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
