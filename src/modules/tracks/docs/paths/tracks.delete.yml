/api/tracks/v1/{trackId}:
  delete:
    tags:
      - Track Management
    summary: Delete a track by ID
    description: >
      Permanently deletes the track associated with the provided track ID.
      This action is irreversible and cannot be undone.

      This endpoint can be used by:
        - The track owner, when they choose to delete their own track.
        - An administrator, when deleting a track on behalf of a user.

      Unauthorized users are not permitted to delete tracks they do not own.

    parameters:
      - name: trackId
        in: path
        required: true
        description: Unique identifier of the track to delete.
        schema:
          $ref: '#/components/schemas/Id'

    responses:
      '200':
        description: Track successfully deleted.
        content:
          application/json:
            example:
              message: Track Deleted Sucessfully


      '400':
        $ref: '#/components/responses/BadRequest'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        $ref: '#/components/responses/Forbidden'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'

      '503':
        $ref: '#/components/responses/ServiceUnavailable'