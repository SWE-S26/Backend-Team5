/api/public/tracks/v1/:
  get:
    tags:
      - Track Management
    summary: Get all tracks paginated
    description: >
      Retrieves a paginated list of publicly available tracks.

      This endpoint is primarily used for:
        - Displaying tracks on the home page (e.g., feed, discovery, or trending sections).
        - Fetching a limited subset of tracks without loading the entire dataset.
        - Supporting features such as pagination, lazy loading, or infinite scrolling.

      The response includes only a portion of the total tracks based on the provided
      pagination parameters (such as page number and page size), ensuring efficient
      data transfer and performance.

      This endpoint does not return private or restricted tracks. Only publicly
      accessible tracks are included in the response.

      Clients can use this endpoint to build user-facing views that require browsing
      or previewing tracks without overwhelming the system or the user with all
      available records in the database.

    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
        example: 10

    responses:
      '200':
        description: Tracks retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Tracks Retrieved Successfully
                data:
                  type: object
                  properties:
                    tracks:
                      type: array
                      items:
                        type: object
                        properties:
                          trackId:
                            type: string
                            example: 69e6bea48ae84d2ffd60e5cb
                          basicInfo:
                            type: object
                            properties:
                              title:
                                type: string
                              permalink:
                                type: string
                              mainArtists:
                                type: array
                                items:
                                  type: string
                              genre:
                                type: string
                              tags:
                                type: array
                                items:
                                  type: string
                              description:
                                type: string
                              isPrivate:
                                type: boolean
                          audio:
                            type: object
                            properties:
                              audioLink:
                                type: string
                                example: https://example.com/audio.mp3
                              id:
                                type: string
                                example: LQ9uT2jj
                              waveformLink:
                                type: string
                                example: https://example.com/waveform.json
                              downloadLink:
                                type: string
                                example: https://example.com/download/audio.mp3
                          durationInSeconds:
                            type: integer
                            example: 13
                          posterId:
                            type: string
                            example: 69e6bea48ae84d2ffd60e5cb
                          image:
                            type: object
                            properties:
                              imgLink:
                                type: string
                              publicId:
                                type: string
                          numLikes:
                            type: integer
                          numPlays:
                            type: integer
                          numReposts:
                            type: integer
                          numComments:
                            type: integer
                          releaseDate:
                            type: string
                            format: date-time
                    paginationInfo:
                      type: object
                      properties:
                        totalNumTracks:
                          type: integer
                          example: 8
                        page:
                          type: integer
                          example: 1
                        totalPages:
                          type: integer
                          example: 1
                        hasNext:
                          type: boolean
                          example: false

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '500':
        $ref: '#/components/responses/ServerError'

/api/public/tracks/v1/{id}:
  get:
    tags:
      - Track Management
    summary: Get track by ID
    description: >
      Retrieves a single track by its unique ID.

      This endpoint is used to fetch full details of a specific track, including its metadata,
      audio information, and engagement statistics.

      It is typically used in:
        - Track detail pages (when a user opens a specific track).
        - Playback screens where full track information is required.

      The response includes all publicly accessible information about the track,
      such as title, artists, genre, tags, audio URL, image, duration, and engagement metrics
      (likes, plays, reposts, and comments).

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 69e6bea48ae84d2ffd60e5cb

    responses:
      '200':
        description: Track retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Track Info Retrieved Successfully
                data:
                  type: object
                  properties:
                    trackId:
                      type: string
                      example: 69e6bea48ae84d2ffd60e5cb
                    basicInfo:
                      type: object
                      properties:
                        title:
                          type: string
                        permalink:
                          type: string
                        mainArtists:
                          type: array
                          items:
                            type: string
                        genre:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        isPrivate:
                          type: boolean
                    image:
                      type: object
                      properties:
                        imgLink:
                          type: string
                        publicId:
                          type: string
                    audio:
                      type: object
                      properties:
                        audioLink:
                          type: string
                          example: https://example.com/audio.mp3
                        id:
                          type: string
                          example: LQ9uT2jj
                        waveformLink:
                          type: string
                          example: https://example.com/waveform.json
                        downloadLink:
                          type: string
                          example: https://example.com/download/audio.mp3
                    durationInSeconds:
                      type: integer
                      example: 13
                    posterId:
                      type: string
                      example: 69e6bea48ae84d2ffd60e5cb
                    numLikes:
                      type: integer
                    numPlays:
                      type: integer
                    numReposts:
                      type: integer
                    numComments:
                      type: integer
                    releaseDate:
                      type: string
                      format: date-time

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'

/api/public/tracks/v1/permalink/{permalink}:
