    description: >
      Checks whether a given permalink is available for use.

      Returns isFound as true if the permalink is already taken,
      false if it is available.

      It is typically used in:
        - Track upload/edit forms to validate permalink availability in real time.

    parameters:
      - name: permalink
        in: path
        required: true
        schema:
          type: string
        example: cairo-grid

    responses:
      '200':
        description: Permalink validity checked successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Requested Done Successfully
                data:
                  type: object
                  properties:
                    isFound:
                      type: boolean
                      example: false

      '400':
        $ref: '#/components/responses/InvalidParameters'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

