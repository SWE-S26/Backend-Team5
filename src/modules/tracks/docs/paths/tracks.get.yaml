      Only tracks that are publicly accessible or allowed for viewing are returned.

      If the user ID is invalid or does not exist, a 404 Not Found response is returned.

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 69e6bea48ae84d2ffd60e5cb

    responses:
      '200':
        description: Posted tracks retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Track Info Retrieved Successfully
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        type: string
                      basicInfo:
                        type: object
                        properties:
                          title:
                            type: string
                          permalink:
                            type: string
                          mainArtists:
                            type: array
                            items:
                              type: string
                          genre:
                            type: string
                          tags:
                            type: array
                            items:
                              type: string
                          isPrivate:
                            type: boolean
                      image:
                        type: object
                        properties:
                          imgLink:
                            type: string
                          publicId:
                            type: string
                      audio:
                        type: object
                        properties:
                          audioLink:
                            type: string
                            example: https://example.com/audio.mp3
                          id:
                            type: string
                            example: LQ9uT2jj
                          waveformLink:
                            type: string
                            example: https://example.com/waveform.json
                          downloadLink:
                            type: string
                            example: https://example.com/download/audio.mp3
                      durationInSeconds:
                        type: integer
                        example: 13
                      isLikedByUser:
                        type: boolean
                        example: true
                      numLikes:
                        type: integer
                      numPlays:
                        type: integer
                      numReposts:
                        type: integer
                      numComments:
                        type: integer
                      releaseDate:
                        type: string
                        format: date-time

      '400':
        $ref: '#/components/responses/InvalidParameters'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/ServerError'