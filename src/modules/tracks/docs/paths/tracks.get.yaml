                        type: string
                      basicInfo:
                        type: object
                        properties:
                          title:
                            type: string
                          permalink:
                            type: string
                          mainArtists:
                            type: array
                            items:
                              type: string
                          genre:
                            type: string
                          tags:
                            type: array
                            items:
                              type: string
                          isPrivate:
                            type: boolean
                      image:
                        type: object
                        properties:
                          imgLink:
                            type: string
                          publicId:
                            type: string
                      numLikes:
                        type: integer
                      numPlays:
                        type: integer
                      numReposts:
                        type: integer
                      numComments:
                        type: integer
                      releaseDate:
                        type: string
                        format: date-time

      '400':
