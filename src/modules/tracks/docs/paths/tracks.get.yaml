                    audio:
                      type: object
                      properties:
                        audioLink:
                          type: string
                          example: https://example.com/audio.mp3
                        id:
                          type: string
                          example: LQ9uT2jj
                        waveformLink:
                          type: string
                          example: https://example.com/waveform.json
                        downloadLink:
                          type: string
                          example: https://example.com/download/audio.mp3
                    durationInSeconds:
                      type: integer
                      example: 13
                    posterId:
