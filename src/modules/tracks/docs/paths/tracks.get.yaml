                            type: string
                          mainArtists:
                            type: array
                            items:
                              type: string
                          genre:
                            type: string
                          tags:
                            type: array
                            items:
                              type: string
                          isPrivate:
                            type: boolean
                      image:
                        type: object
                        properties:
                          imgLink:
                            type: string
                          publicId:
                            type: string
                      audio:
                        type: object
                        properties:
                          audioLink:
                            type: string
                            example: https://example.com/audio.mp3
                          id:
                            type: string
                            example: LQ9uT2jj
                          waveformLink:
                            type: string
                            example: https://example.com/waveform.json
