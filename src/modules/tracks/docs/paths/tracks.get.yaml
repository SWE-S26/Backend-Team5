                      type: object
                      properties:
                        title:
                          type: string
                        permalink:
                          type: string
                        mainArtists:
                          type: array
                          items:
                            type: string
                        genre:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        isPrivate:
                          type: boolean
                    image:
                      type: object
                      properties:
                        imgLink:
