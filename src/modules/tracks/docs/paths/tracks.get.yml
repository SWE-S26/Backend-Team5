/api/public/tracks/v1/:
  get:
    tags:
      - Track Management
    summary: Get all tracks paginated
    operationId: getAllTracks

    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
        example: 10

    responses:
      '200':
        description: Tracks retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Tracks Retrieved Successfully
                data:
                  type: object
                  properties:
                    tracks:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: bbbbbbbbbbbbbbbbbbbbbb02
                          basicInfo:
                            type: object
                            properties:
                              title:
                                type: string
                              permalink:
                                type: string
                              mainArtists:
                                type: array
                                items:
                                  type: string
                              genre:
                                type: string
                              tags:
                                type: array
                                items:
                                  type: string
                              description:
                                type: string
                              isPrivate:
                                type: boolean
                          audio:
                            type: object
                            properties:
                              audioLink:
                                type: string
                              id:
                                type: string
                          image:
                            type: object
                            properties:
                              imgLink:
                                type: string
                              publicId:
                                type: string
                          numLikes:
                            type: integer
                          numPlays:
                            type: integer
                          numReposts:
                            type: integer
                          numComments:
                            type: integer
                          releaseDate:
                            type: string
                            format: date-time
                    paginationInfo:
                      type: object
                      properties:
                        totalNumTracks:
                          type: integer
                          example: 8
                        page:
                          type: integer
                          example: 1
                        totalPages:
                          type: integer
                          example: 1
                        hasNext:
                          type: boolean
                          example: false

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '500':
        $ref: '#/components/responses/ServerError'

/api/public/tracks/v1/{id}:
  get:
    tags:
      - Track Management
    summary: Get track by ID
    operationId: getTrackById

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: bbbbbbbbbbbbbbbbbbbbbb03

    responses:
      '200':
        description: Track retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Track Info Retrieved Successfully
                data:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: bbbbbbbbbbbbbbbbbbbbbb03
                    basicInfo:
                      type: object
                      properties:
                        title:
                          type: string
                        permalink:
                          type: string
                        mainArtists:
                          type: array
                          items:
                            type: string
                        genre:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        isPrivate:
                          type: boolean
                    image:
                      type: object
                      properties:
                        imgLink:
                          type: string
                        publicId:
                          type: string
                    numLikes:
                      type: integer
                    numPlays:
                      type: integer
                    numReposts:
                      type: integer
                    numComments:
                      type: integer
                    releaseDate:
                      type: string
                      format: date-time

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'

