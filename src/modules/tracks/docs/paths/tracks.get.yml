/api/tracks/liked:
  get:
    tags:
      - Track Management
    summary: Get liked tracks for the authenticated user
    description: Returns a paginated list of tracks that the user has liked.
    parameters:
      - $ref: "#/components/parameters/offset"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: Successfully retrieved liked tracks
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  _id:
                    type: string
                  title:
                    type: string
                  mainArtists:
                    type: array
                    items:
                      type: string
                  imageUrl:
                    type: array
                    items:
                      type: string
                  permalink:
                    type: string
                  displayName:
                    type: string
                  userProfileLink:
                    type: string
      "400":
        $ref: "#/components/responses/InvalidParameters"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "404":
        $ref: "#/components/responses/NotFound"
      "500":
        $ref: "#/components/responses/ServerError"

