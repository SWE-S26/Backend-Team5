/api/tracks/v1:
  post:
    tags:
      - Track Management
    summary: Create a new track
    description: Creates a new audio track with metadata, permissions, licensing information, and associated media files.
    operationId: createTrack
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - audio
              - basicInfo
            properties:

              audio:
                type: string
                format: binary
                description: Required audio file

              image:
                type: string
                format: binary
                description: Optional cover image

              basicInfo:
                type: string
                description: |
                  Stringified JSON. Example:
                    {"title":"New Track Title","permalink":"new-track-title","mainArtists":["Artist 1"],"genre":"Hip-Hop","tags":["rap"],"description":"","isPrivate":false,"caption":""}

              permissions:
                type: string
                description: |
                  Stringified JSON. Example:
                    {"enableDirectDownload":true,"offlineListening":true,"includeInRssFeed":true,"displayedEmbedCode":true,"enableAppPlayback":true}

              license:
                type: string
                description: |
                  Stringified JSON. Example:
                    {"type":"allRightsReserved","attribution":false,"nonCommercial":false,"noDerivativeWorks":false,"shareAlike":false}

              advanced:
                type: string
                description: |
                  Stringified JSON. Example:
                    {"buyLink":"https://example.com/buy","recordLabel":"Label","releaseDate":"2026-01-01T00:00:00Z","publisher":"Publisher","ISRC":"USRC17607839","explicitContent":false,"pLine":"2026 Label","audioClipStart":0,"audioClipEnd":30,"composer":"Composer","ISWC":"T-123.456.789-0","albumTitle":"Album"}

    responses:
      '201':
        description: Track created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Track created successfully

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'