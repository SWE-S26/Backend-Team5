# POST
/api/tracks:
  post:
    tags:
      - Track Management
    summary: Create a new track
    description: Creates a new audio track with metadata, permissions, licensing information, and associated media files. Flattened for multipart/form-data.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              # BasicInfo fields
              title:
                type: string
              permalink:
                type: string
              mainArtists:
                type: array
                items:
                  type: string
              genre:
                type: string
              tags:
                type: array
                items:
                  type: string
              description:
                type: array
                items:
                  type: string
              isPrivate:
                type: boolean

              # Permissions fields
              enableDirectDownload:
                type: boolean
              offlineListening:
                type: boolean
              includeInRssFeed:
                type: boolean
              displayedEmbedCode:
                type: boolean
              enableAppPlayback:
                type: boolean

              # Licensing fields
              licensingType:
                type: string
                enum: [allRightsReserved, creativeCommon]
              attribution:
                type: boolean
              nonCommercial:
                type: boolean
              noDerivativeWorks:
                type: boolean
              shareAlike:
                type: boolean

              # Audio clip
              audioClipStart:
                type: string
                description: Start timestamp mm:ss
                example: '00:01'
              audioClipEnd:
                type: string
                description: End timestamp mm:ss
                example: '00:04'

              # Files
              audioFile:
                type: string
                format: binary
              imageFile:
                type: string
                format: binary

              buyLink:
                type: string
              recordLabel:
                type: string
              releaseDate:
                type: date-time
              publisher:
                type: string
              ISRC:
                type: string
              hasExplictContent:
                type: boolean
              pLine:
                type: string

            required:
              - title
              - permalink
              - mainArtists
              - genre
              - isPrivate
              - enableDirectDownload
              - offlineListening
              - includeInRssFeed
              - displayedEmbedCode
              - enableAppPlayback
              - licensingType
              - audioFile
              - imageFile
              - buyLink
              - recordLabel
              - releaseDate
              - publisher
              - ISRC
              - hasExplictContent
              - pLine
    responses:
      '201':
        description: Audio track created successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'created an audio file'
                trackId:
                  $ref: '#/components/schemas/Id'
              required:
                - message
                - trackId

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'
