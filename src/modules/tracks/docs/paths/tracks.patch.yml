                    "shareAlike": false
                  }

              advanced:
                type: string
                description: >
                  JSON stringified object:
                  {
                    "buyLink": "",
                    "recordLabel": "",
                    "releaseDate": "2026-01-01T00:00:00Z",
                    "publisher": "",
                    "ISRC": "",
                    "ISWC": "",
                    "explicitContent": false,
                    "pLine": "",
                    "audioClipStart": 0,
                    "audioClipEnd": 30,
                    "composer": "",
                    "albumTitle": ""
                  }

              geoBlocking:
                type: string
                description: >
                  JSON stringified object controlling geo-restrictions:
                  {
                    "mode": "worldwide | exclusive | blocked",
                    "regions": ["MENA", "EU"],
                    "countries": ["EG", "US"]
