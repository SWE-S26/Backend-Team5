 /api/tracks/v1/:
  patch:
    tags:
      - Track Management
    summary: Update track (metadata and/or media)
    description: >
      Updates an existing track. Supports partial updates.

      This endpoint is used to:
        - Update track metadata (title, genre, tags, etc.)
        - Update permissions and licensing
        - Update advanced publishing settings
        - Replace cover image

      Note:
        - Structured data fields are sent as JSON strings in multipart/form-data
        - Image upload is handled as binary file

    operationId: updateTrackById

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:

              id:
                type: string
                description: Track ID to update
                example: 69d81e7846eff3dce7069b08

              image:
                type: string
                format: binary
                description: Optional cover image replacement

              basicInfo:
                type: string
                description: >
                  JSON stringified object:
                  {
                    "title": "New Title",
                    "permalink": "new-title",
                    "mainArtists": ["Artist 1"],
                    "genre": "Hip-Hop",
                    "tags": ["rap"],
                    "description": "",
                    "isPrivate": false,
                    "caption": ""
                  }

              permissions:
                type: string
                description: >
                  JSON stringified object:
                  {
                    "enableDirectDownload": true,
                    "offlineListening": true,
                    "includeInRssFeed": true,
                    "displayedEmbedCode": true,
                    "enableAppPlayback": true
                  }

              license:
                type: string
                description: >
                  JSON stringified object:
                  {
                    "type": "allRightsReserved",
                    "attribution": false,
                    "nonCommercial": false,
                    "noDerivativeWorks": false,
                    "shareAlike": false
                  }

              advanced:
                type: string
                description: >
                  JSON stringified object:
                  {
                    "buyLink": "",
                    "recordLabel": "",
                    "releaseDate": "2026-01-01T00:00:00Z",
                    "publisher": "",
                    "ISRC": "",
                    "ISWC": "",
                    "explicitContent": false,
                    "pLine": "",
                    "audioClipStart": 0,
                    "audioClipEnd": 30,
                    "composer": "",
                    "albumTitle": ""
                  }

    responses:
      '200':
        description: Track updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Track Info Updated Successfully
                data:
                  $ref: '#/components/schemas/Track'

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        $ref: '#/components/responses/Forbidden'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'


 /api/tracks/v1/listen/{id}:
  patch:
    tags:
      - Track Management
    summary: Increment track play count
    description: |
      Increments the number of plays for a specific track.

      This endpoint is called when a user starts and completes playback of a track
      (from start to finish).

      **Note:**
      The current implementation treats a play event as a single increment trigger.

      More advanced play-tracking logic (e.g., time-based validation, partial plays,
      or engagement thresholds) may be introduced in future releases.

    operationId: incrementTrackNumPlays

    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 69d81e7846eff3dce7069b08

    responses:
      '200':
        description: Play count updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Number of Plays Updated Successfully

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'