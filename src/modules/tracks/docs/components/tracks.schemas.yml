# OpenAPI parameter definitions for the tracks module, starting writing normally like paths
TrackPublicResponse:
  type: object
  properties:
    trackId:
      type: string
      example: 69e6bea48ae84d2ffd60e5cb
    basicInfo:
      type: object
      properties:
        title:
          type: string
        permalink:
          type: string
        mainArtists:
          type: array
          items:
            type: string
        genre:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        caption:
          type: string
        isPrivate:
          type: boolean
    audio:
      type: object
      properties:
        audioLink:
          type: string
          example: https://example.com/audio.mp3
        id:
          type: string
          example: LQ9uT2jj
        waveformLink:
          type: string
          example: https://example.com/waveform.json
        downloadLink:
          type: string
          example: https://example.com/download/audio.mp3
    durationInSeconds:
      type: integer
      example: 13
    posterId:
      type: string
      example: 69e6bea48ae84d2ffd60e5cb
    image:
      type: object
      properties:
        imgLink:
          type: string
        publicId:
          type: string
    numLikes:
      type: integer
    numPlays:
      type: integer
    numReposts:
      type: integer
    numComments:
      type: integer
    numDownloads:
      type: integer
    releaseDate:
      type: string
      format: date-time
    audioClip:
      type: object
      properties:
        start:
          type: integer
          example: 0
        end:
          type: integer
          example: 30
    permissions:
      type: object
      properties:
        enableDirectDownload:
          type: boolean
        offlineListening:
          type: boolean
        includeInRssFeed:
          type: boolean
        displayedEmbedCode:
          type: boolean
        enableAppPlayback:
          type: boolean
    license:
      type: object
      properties:
        type:
          type: string
          enum:
            - allRightsReserved
            - creativeCommons
        attribution:
          type: boolean
        nonCommercial:
          type: boolean
        noDerivativeWorks:
          type: boolean
        shareAlike:
          type: boolean

TrackPrivateResponse:
  allOf:
    - $ref: '#/components/schemas/TrackPublicResponse'
    - type: object
      properties:
        isLikedByUser:
          type: boolean
          example: true

PlaylistPublicResponse:
  type: object
  properties:
    _id:
      type: string
      example: 69edd49d63a6eab14eed5458
    artistId:
      type: object
      properties:
        _id:
          type: string
        displayName:
          type: string
        profileLink:
          type: string
        profileImg:
          type: object
          properties:
            imgLink:
              type: string
            publicId:
              type: string
    title:
      type: string
    permaLink:
      type: string
    description:
      type: string
    genre:
      type: string
    listOfTracks:
      type: array
      items:
        type: string
    additionalTags:
      type: array
      items:
        type: string
    isPrivate:
      type: boolean
    numOfLikes:
      type: integer
    numOfReposts:
      type: integer
    playlistType:
      type: string
      enum:
        - playlist
        - album
    playlistLengthInSeconds:
      type: integer
    rssFeedLink:
      type: string
    recordLabel:
      type: string
    image:
      type: object
      properties:
        imgLink:
          type: string
        publicId:
          type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

