/api/messages/v1/send:
  post:
    summary: Send a New Message
    description: |
      Sends a new message to another user and returns the updated conversation object.
      Intended to be triggered from two entry points: the message button on another 
      user's profile page, or the "New Message" button on the messages page.
      If a conversation between the two users already exists, the message is appended 
      to the existing conversation. If no conversation exists, a new one is created.
      If the conversation was previously archived by either party, it is automatically 
      reactivated and removed from the archived state for both participants, restoring 
      it to the main chat side panel.
    tags:
      - Message
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - receiverId
              - content
            properties:
              receiverId:
                type: string
                description: The ObjectId of the user to send the message to
                example: 69e6977c88827a9c11d55b31
              content:
                type: string
                description: Message content (1-2000 characters)
                minLength: 1
                maxLength: 2000
                example: Fire Tornado
          example:
            receiverId: 69e6977c88827a9c11d55b31
            content: Fire Tornado
    responses:
      "200":
        description: Message sent successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: message sent sucessfully
                data:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: 69e69a358352c5b3bb1c8fa4
                    lastMessage:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: 69e7d0c5fa5cd81557898d2d
                        senderId:
                          type: string
                          example: 69beeb8046a92874acec2764
                        content:
                          type: string
                          example: Fire Tornado
                        seenBy:
                          type: array
                          items:
                            type: string
                          example: ["69beeb8046a92874acec2764"]
                        createdAt:
                          type: string
                          format: date-time
                          example: 2026-04-21T19:32:21.820Z
                    receiver:
                      type: object
                      properties:
                        displayName:
                          type: string
                          example: engseifmohamed2004
                        photoUrl:
                          type: string
                          format: uri
                          example: https://res.cloudinary.com/dr1sqiouu/image/upload/v1776357570/profile/file_ud25rn.png
      "400":
        description: Invalid request body
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Invalid ObjectId
      "401":
        $ref: '#/components/responses/Unauthorized'
      "404":
        $ref: '#/components/responses/NotFound'
      "500":
        $ref: '#/components/responses/ServerError'