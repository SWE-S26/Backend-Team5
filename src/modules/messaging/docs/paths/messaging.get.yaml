# GET
/api/message/all:
    get:
      tags:
        - Message
      summary: Retrieve all messages for the authenticated user
      description: |
        Returns a list of messages associated with the authenticated user.
        This includes messages sent to the user (Inbox) Authentication is required and the user is identified
        from the JWT stored in the secure HTTP-only cookie.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of messages returned per page
      responses:
          200:
            description: Messages retrieved successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      type: boolean
                      description: Indicates whether the request was successful
                      example: true
                    message:
                      type: string
                      description: Informational message about the result
                      example: Messages retrieved successfully
                    data:
                      type: object
                      properties:
                        messages:
                          type: array
                          description: List of messages for the authenticated user
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier of the message
                              senderId:
                                type: string
                                description: ID of the user who sent the message
                              receiverId:
                                type: string
                                description: ID of the user who received the message
                              content:
                                type: string
                                description: The message text
                              isRead:
                                type: boolean
                                description: Indicates whether the message has been read
                              createdAt:
                                type: string
                                format: date-time
                                description: Timestamp when the message was sent
                example:
                  success: true
                  message: Messages retrieved successfully
                  data:
                    messages:
                      - id: msg_001
                        senderId: user_123
                        receiverId: user_456
                        content: Hello!
                        isRead: false
                        createdAt: 2026-03-05T12:00:00Z
                      - id: msg_002
                        senderId: user_456
                        receiverId: user_123
                        content: Hi, how are you?
                        isRead: true
                        createdAt: 2026-03-05T12:05:00Z
          401:
            $ref: '#/components/responses/Unauthorized'
          404:
            $ref: '#/components/responses/NotFound'
          500:
            $ref: '#/components/responses/ServerError'
/api/message/conversation/{userId}:
  get:
    tags:
      - Message
    summary: Retrieve conversation with a specific user
    description: |
      Returns the conversation (all exchanged messages) between the
      authenticated user and the specified user. The authenticated user
      is identified from the JWT stored in the secure HTTP-only cookie.

    security:
      - bearerAuth: []

    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the user whose conversation is being retrieved
        example: user_456

      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number for pagination

      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Number of messages returned per page

    responses:
      "200":
        description: Conversation retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Conversation retrieved successfully
                data:
                  type: object
                  properties:
                    messages:
                      type: array
                      description: List of messages exchanged between the two users
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier of the message
                          senderId:
                            type: string
                            description: ID of the user who sent the message
                          receiverId:
                            type: string
                            description: ID of the user who received the message
                          content:
                            type: string
                            description: Message text
                          isRead:
                            type: boolean
                            description: Indicates whether the message has been read
                          createdAt:
                            type: string
                            format: date-time
                            description: Timestamp when the message was sent
            example:
              success: true
              message: Conversation retrieved successfully
              data:
                messages:
                  - id: msg_101
                    senderId: user_123
                    receiverId: user_456
                    content: Hello!
                    isRead: true
                    createdAt: 2026-03-05T10:00:00Z
                  - id: msg_102
                    senderId: user_456
                    receiverId: user_123
                    content: Hi, how are you?
                    isRead: false
                    createdAt: 2026-03-05T10:01:30Z
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/message/unread-count:
  get:
    tags:
      - Message
    summary: Retrieve the number of unread messages
    description: |
      Returns the total count of unread messages for the authenticated user.
      The user is identified from the JWT stored in the secure HTTP-only cookie.

    security:
      - bearerAuth: []

    responses:
      "200":
        description: Unread message count retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Unread messages count retrieved successfully
                data:
                  type: object
                  properties:
                    count:
                      type: integer
                      description: Total number of unread messages
                      example: 5
            example:
              success: true
              message: Unread messages count retrieved successfully
              data:
                count: 5

      401:
        $ref: '#/components/responses/Unauthorized'

      429:
        description: Too many requests – rate limit exceeded
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Too many requests, please try again later
                data:
                  nullable: true
                  type: object
            example:
              success: false
              message: Too many requests, please try again later
              data: null

      500:
        $ref: '#/components/responses/ServerError'