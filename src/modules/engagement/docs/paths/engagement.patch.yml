# PATCH paths for engagement module

/api/engagement/tracks/v1/{trackId}/repost:
  patch:
    tags:
      - Reposts
    summary: Update repost caption.
    description: Updates the caption of an existing repost for the authenticated user. User must have already reposted the track.
    operationId: updateTrackRepostCaption
    parameters:
      - $ref: '#/components/parameters/TrackIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateRepostCaptionRequest'
    responses:
      200:
        description: Caption updated successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepostCaptionResponse'
      400:
        description: Bad request - user has not reposted this track.
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  example: 'You have not reposted this track'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
    security:
      - BearerAuth: []
