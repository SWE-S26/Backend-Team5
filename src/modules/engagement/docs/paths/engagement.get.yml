/api/public/engagement/tracks/v1/{trackId}/comments:
  get:
    tags:
      - Comments
    summary: Get top-level comments for a track.
    description: Returns a paginated list of top-level comments with configurable sorting. Public endpoint — no authentication required.
    operationId: getTrackComments
    parameters:
      - $ref: '#/components/parameters/TrackIdParam'
      - $ref: '#/components/parameters/EngagementOffsetParam'
      - $ref: '#/components/parameters/EngagementLimitParam'
      - $ref: '#/components/parameters/CommentSortByParam'
    responses:
      200:
        description: Paginated list of top-level comments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentListResponse'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
    security: []

/api/public/engagement/comments/v1/{commentId}/replies:
  get:
    tags:
      - Comments
    summary: Get replies for a comment.
    description: Returns a paginated list of replies for a specific comment, ordered by created_at ascending. Public endpoint — no authentication required.
    operationId: getCommentReplies
    parameters:
      - $ref: '#/components/parameters/CommentIdParam'
      - $ref: '#/components/parameters/EngagementOffsetParam'
      - $ref: '#/components/parameters/EngagementLimitParam'
    responses:
      200:
        description: Paginated list of replies.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyListResponse'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
    security: []

/api/engagement/tracks/v1/{trackId}/repost:
  get:
    tags:
      - Reposts
    summary: Check if user has reposted a track.
    description: Returns the repost status for the authenticated user, including caption and timestamp if reposted. Requires authentication.
    operationId: getTrackRepostStatus
    parameters:
      - $ref: '#/components/parameters/TrackIdParam'
    responses:
      200:
        description: Repost status for the authenticated user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackRepostStatusResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
    security:
      - BearerAuth: []
