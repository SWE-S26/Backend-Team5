# POST paths for engagement module

/api/v1/tracks/{trackId}/like:
  post:
    tags:
      - Likes
    summary: Toggle like on a track.
    description: Likes a track if the user has not liked it yet. If the user already liked it, the like is removed (unlike). Updates the number_of_likes count atomically.
    operationId: toggleTrackLike
    parameters:
      - $ref: '#/components/parameters/TrackIdParam'
    responses:
      200:
        description: Like toggled successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleLikeResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/v1/tracks/{trackId}/repost:
  post:
    tags:
      - Reposts
    summary: Toggle repost on a track.
    description: Reposts a track if the user has not reposted it yet. If the user already reposted it, the repost is removed. Updates the number_of_reposts count atomically.
    operationId: toggleTrackRepost
    parameters:
      - $ref: '#/components/parameters/TrackIdParam'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepostRequest'
    responses:
      200:
        description: Repost toggled successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleRepostResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/v1/playlists/{playlistId}/like:
