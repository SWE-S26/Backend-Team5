      - Likes
    summary: Toggle like on a playlist.
    description: Likes a playlist if the user has not liked it yet. If the user already liked it, the like is removed (unlike). Updates the numOfLikes count atomically.
    operationId: togglePlaylistLike
    parameters:
      - $ref: '#/components/parameters/PlaylistIdParam'
    responses:
      200:
        description: Like toggled successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TogglePlaylistLikeResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/v1/playlists/{playlistId}/repost:
  post:
    tags:
      - Reposts
    summary: Toggle repost on a playlist.
    description: Reposts a playlist if the user has not reposted it yet. If the user already reposted it, the repost is removed. Updates the numberOfReposts count atomically.
    operationId: togglePlaylistRepost
    parameters:
      - $ref: '#/components/parameters/PlaylistIdParam'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepostRequest'
    responses:
      200:
        description: Repost toggled successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TogglePlaylistRepostResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/v1/tracks/{trackId}/comments:
  post:
    tags:
      - Comments
    summary: Post a comment on a track.
    description: Creates a new comment on a track. Comments can be pinned to a specific timestamp. If parentCommentId is provided, the comment is treated as a reply. Requires allow_comments to be enabled on the track.
    operationId: createComment
    parameters:
      - $ref: '#/components/parameters/TrackIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCommentRequest'
    responses:
      201:
        description: Comment created successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentEntry'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/v1/tracks/{trackId}/comments/{commentId}/like:
  post:
    tags:
      - Comments
    summary: Toggle like on a comment.
    description: Likes a comment if the user has not liked it yet. If the user already liked it, the like is removed (unlike). Updates the numLikes count on the comment atomically.
    operationId: toggleCommentLike
    parameters:
      - $ref: '#/components/parameters/TrackIdParam'
      - $ref: '#/components/parameters/CommentIdParam'
    responses:
      200:
        description: Comment like toggled successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleCommentLikeResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
