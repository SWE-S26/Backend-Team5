# DELETE paths for engagement module

/api/engagement/comments/v1/{commentId}:
  delete:
    tags:
      - Comments
    summary: Delete a comment.
    description: Deletes a comment. The comment author or the track owner may delete it. Deleting a parent comment also removes all replies.
    operationId: deleteComment
    parameters:
      - $ref: '#/components/parameters/CommentIdParam'
    responses:
      200:
        description: Comment deleted successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Comment deleted successfully.'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'
