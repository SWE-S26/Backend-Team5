ToggleLikeResponse:
  type: object
  properties:
    liked:
      type: boolean
      example: true
    numOfLikes:
      type: integer
      example: 42
  required:
    - liked
    - numOfLikes

ToggleRepostResponse:
  type: object
  properties:
    reposted:
      type: boolean
      example: true
    numberOfReposts:
      type: integer
      example: 15
  required:
    - reposted
    - numberOfReposts

ToggleCommentLikeResponse:
  type: object
  properties:
    liked:
      type: boolean
      example: true
    numLikes:
      type: integer
      example: 7
  required:
    - liked
    - numLikes

TogglePlaylistLikeResponse:
  type: object
  properties:
    liked:
      type: boolean
      example: true
    numOfLikes:
      type: integer
      example: 10
  required:
    - liked
    - numOfLikes

TogglePlaylistRepostResponse:
  type: object
  properties:
    reposted:
      type: boolean
      example: false
    numberOfReposts:
      type: integer
      example: 3
  required:
    - reposted
    - numberOfReposts

UserEngagementSnippet:
  type: object
  description: Minimal user info used in engagement lists.
  properties:
    userId:
      type: string
      example: 'usr_001'
    displayName:
      type: string
      example: 'John Doe'
    avatarUrl:
      type: string
      format: uri
      example: 'https://cdn.example.com/avatars/usr_001.jpg'
    followersCount:
      type: integer
      minimum: 0
      example: 134
  required:
    - userId
    - displayName
    - followersCount

UserEngagementListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 120
    offset:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    users:
      type: array
      items:
        $ref: '#/components/schemas/UserEngagementSnippet'
  required:
    - total
    - offset
    - limit
    - users

RepostRequest:
  type: object
  properties:
    caption:
      type: string
      maxLength: 280
      example: 'Love this track!'

TrackRepostStatusResponse:
  type: object
  properties:
    reposted:
      type: boolean
      example: true
    caption:
      type: string
      example: 'Love this track!'
    repostedAt:
      type: string
      format: date-time
      example: '2025-01-15T12:00:00Z'
  required:
    - reposted

TrackLikeStatusResponse:
  type: object
  properties:
    liked:
      type: boolean
      example: true
  required:
    - liked

UpdateRepostCaptionRequest:
  type: object
  properties:
    caption:
      type: string
      maxLength: 280
      example: 'Updated caption text!'
  required:
    - caption

UpdateRepostCaptionResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    caption:
      type: string
      example: 'Updated caption text!'
  required:
    - success
    - caption

CreateCommentRequest:
  type: object
  properties:
    content:
      type: string
      minLength: 1
      maxLength: 500
      description: Comment text. Must not be empty or whitespace-only.
      example: 'Great track!'
    timestamp:
      type: integer
      minimum: 0
      description: Position in the track in seconds to pin the comment.
      example: 42
    parentCommentId:
      type: string
      description: ID of the parent comment when posting a reply.
      example: 'cmt_001'
    mentionedUserId:
      type: string
      description: Optional mentioned user id.
      example: '507f1f77bcf86cd799439012'
  required:
    - content

CommentEntry:
  type: object
  properties:
    commentId:
      type: string
      example: 'cmt_001'
    userId:
      type: string
      example: 'usr_001'
    displayName:
      type: string
      example: 'Jane Smith'
    avatarUrl:
      type: string
      format: uri
      example: 'https://cdn.example.com/avatars/usr_001.jpg'
    content:
      type: string
      example: 'Amazing track!'
    timestamp:
      type: number
      example: 30.0
    numLikes:
      type: integer
      example: 5
    replyCount:
      type: integer
      example: 2
    isLikedByUser:
      type: boolean
      example: false
    isOwnComment:
      type: boolean
      example: false
    mentionedUserProfileLink:
      type: string
      example: 'jane-smith-ab12c'
    createdAt:
      type: string
      format: date-time
      example: '2025-01-15T12:00:00Z'
  required:
    - commentId
    - userId
    - displayName
    - content
    - numLikes
    - replyCount
    - isLikedByUser
    - isOwnComment
    - createdAt

MentionFollower:
  type: object
  properties:
    userId:
      type: string
      example: 'usr_001'
    displayName:
      type: string
      example: 'Jane Smith'
    avatarUrl:
      type: string
      format: uri
      example: 'https://cdn.example.com/avatars/usr_001.jpg'
    profileLink:
      type: string
      example: 'jane-smith-ab12c'
  required:
    - userId
    - displayName
    - profileLink

RepostedTracksResponse:
  type: object
  properties:
    total:
      type: integer
      minimum: 0
      example: 12
    offset:
      type: integer
      minimum: 0
      example: 0
    limit:
      type: integer
      minimum: 1
      example: 20
    tracks:
      type: array
      items:
        type: object
        properties:
          repostCaption:
            type: string
            description: Optional caption added by the user when reposting.
            example: 'Love this track!'
        additionalProperties: true
  required:
    - total
    - offset
    - limit
    - tracks

RepostedPlaylistsResponse:
  type: object
  properties:
    total:
      type: integer
      minimum: 0
      example: 8
    offset:
      type: integer
      minimum: 0
      example: 0
    limit:
      type: integer
      minimum: 1
      example: 20
    playlists:
      type: array
      items:
        type: object
        properties:
          repostCaption:
            type: string
            description: Optional caption added by the user when reposting.
            example: 'This mix is perfect for late nights.'
        additionalProperties: true
  required:
    - total
    - offset
    - limit
    - playlists

CommentListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 50
    offset:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    comments:
      type: array
      items:
        $ref: '#/components/schemas/CommentEntry'
  required:
    - total
    - offset
    - limit
    - comments

ReplyListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 10
    offset:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    replies:
      type: array
      items:
        $ref: '#/components/schemas/CommentEntry'
  required:
    - total
    - offset
    - limit
    - replies
