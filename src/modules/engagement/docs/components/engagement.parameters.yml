TrackIdParam:
  name: trackId
  in: path
  required: true
  description: The unique identifier of the track.
  schema:
    type: string
    example: 'trk_456'

CommentIdParam:
  name: commentId
  in: path
  required: true
  description: The unique identifier of the comment.
  schema:
    type: string
    example: 'cmt_001'

PlaylistIdParam:
  name: playlistId
  in: path
  required: true
  description: The unique identifier of the playlist.
  schema:
    type: string
    example: 'pl_789'

EngagementOffsetParam:
  name: offset
  in: query
  required: false
  description: Page number to return (1-based).
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 1

EngagementLimitParam:
  name: limit
  in: query
  required: false
  description: Number of results to return (max 50).
  schema:
    type: integer
    minimum: 1
    maximum: 50
    default: 20
    example: 20

CommentSortByParam:
  name: sortBy
  in: query
  required: false
  description: Sort order for comments. Use 'newest' to sort by creation time (newest first), 'oldest' for creation time (oldest first), or 'trackTime' to sort by timestamp position in the track.
  schema:
    type: string
    enum:
      - newest
      - oldest
      - trackTime
    default: newest
    example: newest
