  /api/search/add-to-history:
    post:
      tags:
        - Search
      summary: Add item to search history
      description: Adds a clicked search result to the authenticated user's search history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id:
                  type: string
                  description: the id of the clicked item
                type:
                  type: string
                  enum: [track, user, playlist, album]
                  description: the type of the clicked item
      responses:
        '201':
          description: Item added to history
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
