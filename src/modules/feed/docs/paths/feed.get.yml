  /api/feed:
    get:
      tags:
        - Feed
      summary: Get user activity feed
      description: Returns chronological feed of new tracks from followed artists
      operationId: getUserFeed
      parameters:
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam' 
      responses:
        '200':
          description: Feed retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Global Search
  /api/search:
    get:
      tags:
        - Search
      summary: Global search
      description: Search across Tracks, Users, Playlists, and Albums
      operationId: globalSearch
      parameters:
        - name: q
          in: query
          required: true
          description: Keyword for search
          schema:
            type: string

        - name: type
          in: query
          schema:
            type: string
            enum: [everything, tracks, users, playlists, albums]      

        - name: dateRange
          in: query
          schema:
            type: string
            enum: [hour, day, week, month, year, all]   
            description: this is only for tracks

        - name: duration
          in: query
          schema:
            type: string
            enum: [lt2, 2to10, 10to30, gt30, all]    
            description: this is only for tracks

        - name: usage
          in: query
          schema:
            type: string
            enum: [commercial, modify, share, listen]     
            description: this is only for tracks

        - name: tag
          in: query
          schema:
            type: string   
            description: this is used 


        - name: location
          in: query
          schema:
            type: string  
            description: this is only for users                                                             
  
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'
  

  
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      tracks:
                        type: integer
                      users:
                        type: integer
                      playlists:
                        type: integer
                      albums:
                        type: integer

                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [track, user, playlist, album]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  
  # Search Suggestions
  /api/search/suggestions:
    get:
      tags:
        - Search
      summary: Search suggestions
      description: Returns autocomplete suggestions while the user types
      operationId: getSearchSuggestions
  
      parameters:
        - name: q
          in: query
          required: true
          description: Partial search keyword
          schema:
            type: string
            minLength: 1
  
      responses:
        '200':
          description: Suggestions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                      enum: [track, user, playlist, album]
                    title:
                      type: string
                    imgLink:
                      type: string
                      format: uri
                    isPersonalized:
                      type: boolean
                      description:  true if user likes or follows they are of max 2, and it has different view in the app
  
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidQuery:
                  value:
                    success: false
                    message: "Query parameter 'q' must not be empty"
                    code: 400
  
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/search/history:
    get:
      tags:
        - Search
      summary: Get search history
      description: Returns the authenticated user's recent search history.
      responses:
        '200':
          description: Search history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                      enum: [track, user, playlist, album]
                    title:
                      type: string
                    imageUrl:
                      type: string
                    metadata:
                      type: string
                      nullable: true
                      description: this metadata is user-->location, playlist--> the account displayname, track --> the account displayname, note the user can have no location so i return null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/trending:
    get:
      tags:
        - Feed
      summary: Get trending tracks
      description: Returns top tracks based on recent plays and engagement
      operationId: getTrendingTracks
      parameters:
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/LimitParam'      
      responses:
        '200':
          description: Trending tracks retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'             