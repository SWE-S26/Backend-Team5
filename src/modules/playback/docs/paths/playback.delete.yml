/api/playback/v1/history/:
  delete:
    tags:
      - Playback
    summary: Delete user history
    operationId: deleteUserHistory
    security:
      - bearerAuth: []

    responses:
      '200':
        description: User history deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: User History Deleted Successfully

      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/ServerError'
