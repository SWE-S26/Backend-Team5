/api/playlists/v1/{playlistId}:
  put:
    tags:
      - Playlist Management
    summary: Update playlist metadata and tracks
    description: >
      Updates playlist metadata, licensing, image, and optionally replaces/reorders tracks.
      Must include full track list to avoid accidental deletions from concurrent edits.

    parameters:
      - name: playlistId
        in: path
        required: true
        schema:
          type: string
          example: pl_789

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              title:
                type: string
              permalink:
                type: string
              additionalTags:
                type: array
                items:
                  type: string
              'type':
                type: string
                enum: [public, private]
              playlistType:
                type: string
                enum: [playlist, album, ep, single]
              releaseDate:
                type: string
                format: date-time
              genre:
                type: string
              tags:
                type: array
                items:
                  type: string
              description:
                type: string
              isPrivate:
                type: boolean
                example: false
              audioTracks:
                type: array
                items:
                  type: string
              lengthOfRecievedTracks:
                type: integer
              licensing:
                $ref: '#/components/schemas/Licensing'
              buyLink:
                type: string
              recordLabel:
                type: string
              image:
                type: string
                format: binary

    responses:
      '200':
        description: Playlist updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Updated successfully

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        $ref: '#/components/responses/Forbidden'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'
