/api/playlists/v1:
  get:
    tags:
      - Playlist Management
    summary: Get all public playlists CALL IF LOGGED IN SO AS TO HANDLE BLOCKED USERS
    description: |
      Retrieves a paginated list of public playlists.
      Doesn't show playlists of blocked users if the user is authenticated.
    parameters:
      - $ref: '#/components/parameters/Playlistlimit'
      - $ref: '#/components/parameters/Playlistoffset'
    responses:
      '200':
        description: Playlists retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Playlists retrieved successfully
                data:
                  type: object
                  properties:
                    playlists:
                      type: array
                      items:
                        $ref: '#/components/schemas/Playlist'
      '400':
        $ref: '#/components/responses/InvalidParameters'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '500':
        $ref: '#/components/responses/ServerError'

