/api/v1/playlists:
  post:
    tags:
      - Playlist Management
    summary: Create a new playlist
    description: Creates a new playlist with a name, list of track IDs, and privacy setting.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              playlistName:
                type: string
              tracks:
                type: array
                items:
                  type: string
                description: Array of track IDs
              isPrivate:
                type: boolean
            required:
              - playlistName
              - tracks
              - isPrivate

    responses:
      '200':
        description: Playlist created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Created successfully'
                data:
                  type: object
                  properties:
                    playlists:
                      type: array
                      items:
                        $ref: '#/components/schemas/Playlist'
              required:
                - message
                - data

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        $ref: '#/components/responses/Forbidden'

      '500':
        $ref: '#/components/responses/ServerError'

/api/v1/playlists/{playlistId}/history:
  post:
    tags:
      - Playlist Management
    summary: Add playlist to history
    description: Adds a playlist to the user's history.
    parameters:
      - $ref: '#/components/parameters/PlaylistIdPathParam'

    responses:
      '200':
        description: Playlist added to history successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Playlist added to history successfully'
              required:
                - message

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        $ref: '#/components/responses/Forbidden'

      '500':
        $ref: '#/components/responses/ServerError'
