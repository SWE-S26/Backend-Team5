/api/playlists/v1/{playlistId}/image:
  patch:
    tags:
      - Playlist Management
    summary: Update playlist image
    description: Updates the image of the specified playlist.

    parameters:
      - $ref: '#/components/parameters/PlaylistIdPathParam'

    responses:
      '200':
        description: Playlist track order updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Track order updated successfully'
                data:
                  type: object
                  properties:
                    playlist:
                      $ref: '#/components/schemas/Playlist'
              required:
                - message
                - data

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'

/api/playlists/v1/{playlistId}/tracks:
  patch:
    tags:
      - Playlist Management
    summary: Update playlist track order (by index move)
    description: Moves a track from one position to another inside the playlist without affecting other tracks.

    parameters:
      - $ref: '#/components/parameters/PlaylistIdPathParam'

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - trackId
              - oldPosition
              - newPosition
            properties:
              trackId:
                type: string
                example: trk_123
              oldPosition:
                type: integer
                example: 0
              newPosition:
                type: integer
                example: 3

    responses:
      '200':
        description: Track order updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Track order updated successfully

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        $ref: '#/components/responses/Forbidden'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'

/api/playlists/v1/{playlistId}/tracks/{trackId}:
  patch:
    tags:
      - Playlist Management
    summary: Add a track to a playlist
    description: Adds a track to the end of the playlist.

    parameters:
      - $ref: '#/components/parameters/PlaylistIdPathParam'
      - $ref: '#/components/parameters/TrackIdPathParam'
    responses:
      '200':
        description: Track added to playlist successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Track added to playlist successfully

      '400':
        $ref: '#/components/responses/InvalidParameters'

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        $ref: '#/components/responses/Forbidden'

      '404':
        $ref: '#/components/responses/NotFound'

      '500':
        $ref: '#/components/responses/ServerError'
