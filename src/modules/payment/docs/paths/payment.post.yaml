/api/payment/v1/user:
  post:
    tags:
      - Payment
    summary: Register the user as a Stripe customer (call this once before subscribing)
    description: |
      Creates a new Stripe customer for the authenticated user and attaches 
      the provided payment method as their default. This must be called once 
      successfully before the user can create a subscription.

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - paymentMethodId
            properties:
              paymentMethodId:
                type: string
                description: Stripe Payment Method ID to attach as the default payment method
                example: pm_1ABCXYZ

    responses:
      '201':
        description: Stripe customer created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: User created successfully
                data:
                  type: object
                  nullable: true
                  properties:
                    userId:
                      type: string
                      description: The Stripe customer ID
                      example: cus_ABC123XYZ
            example:
              success: true
              message: User created successfully
              data:
                userId: cus_ABC123XYZ

      '400':
        description: Bad request – user already has a Stripe customer ID, or Stripe rejected the payment method
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: User already has a Stripe customer ID
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: User already has a Stripe customer ID
              data: null

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        description: Forbidden – admin users cannot have subscriptions
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Admin users cannot have subscriptions
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Admin users cannot have subscriptions
              data: null

      '404':
        description: User not found
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: User not found
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: User not found
              data: null

      '500':
        $ref: '#/components/responses/ServerError'

/api/payment/v1/subscriptions:
  post:
    tags:
      - Payment
    summary: Create a subscription for the authenticated user
    description: |
      Creates a Stripe subscription for the currently authenticated user 
      using their already-attached payment method. The user must have been 
      registered as a Stripe customer first via POST /api/payment/v1/user.

      Please call refresh token after this API to get the updated subscription 
      status in the access token claims.

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - priceId
            properties:
              priceId:
                type: string
                description: Stripe price ID for the desired plan
                example: price_1TGQ4EKiCVlMQgBUJwZCK3um
              promoCode:
                type: string
                description: Optional promo code for a one-time discount on the first invoice
                example: JU1CY
                nullable: true

    responses:
      '201':
        description: Subscription created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Subscription created successfully
                data:
                  type: object
                  nullable: true
                  properties:
                    subscriptionId:
                      type: string
                      example: sub_123456789
            example:
              success: true
              message: Subscription created successfully
              data:
                subscriptionId: sub_123456789

      '400':
        description: Bad request – invalid price ID, missing Stripe customer ID, or user already has an active subscription
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: User already has an active subscription
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: User already has an active subscription
              data: null

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        description: Forbidden – admin users cannot have subscriptions
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Admin users cannot have subscriptions
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Admin users cannot have subscriptions
              data: null

      '404':
        description: User not found
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: User not found
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: User not found
              data: null

      '500':
        $ref: '#/components/responses/ServerError'

/api/public/payment/v1/webhook/stripe:
  post:
    tags:
      - Payment
    summary: Stripe webhook listener (DO NOT CALL — Stripe calls this automatically)
    description: |
      Endpoint used by Stripe to deliver webhook events related to payments and subscriptions.
      Requires a valid `Stripe-Signature` header for verification.

      Handled events:
      - `invoice.paid` — marks the user as paid
      - `invoice.payment_failed` — marks the user as unpaid
      - `customer.subscription.deleted` — removes subscription and downgrades the user's role
      - `customer.subscription.updated` — syncs subscription plan changes to the user's role

    parameters:
      - in: header
        name: Stripe-Signature
        required: true
        schema:
          type: string
        description: Stripe webhook signature for payload verification
        example: t=1234567890,v1=abc123...

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                example: evt_1ABCXYZ123
              type:
                type: string
                example: invoice.paid
              data:
                type: object
                properties:
                  object:
                    type: object
                    properties:
                      id:
                        type: string
                        example: sub_123456789
                      customer:
                        type: string
                        example: cus_ABC123XYZ

    responses:
      '200':
        description: Webhook event processed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Webhook processed successfully
                data:
                  type: object
                  nullable: true
            example:
              success: true
              message: Webhook processed successfully
              data: null

      '400':
        description: Invalid webhook signature or missing raw body
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Invalid Stripe webhook signature
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Invalid Stripe webhook signature
              data: null

      '429':
        description: Too many webhook requests
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Too many webhook events received
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Too many webhook events received
              data: null

      '500':
        $ref: '#/components/responses/ServerError'
