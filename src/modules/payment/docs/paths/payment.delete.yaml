/api/payment/subscriptions:
  delete:
    tags:
      - Payment
    summary: Cancel the user's subscription
    description: Cancels the authenticated user's subscription. The cancellation can occur immediately or at the end of the billing period.

    security:
      - bearerAuth: []

    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              cancelAtPeriodEnd:
                type: boolean
                description: Whether to cancel at the end of the billing period
                example: true

    responses:
      "200":
        description: Subscription cancelled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Subscription cancelled successfully
                data:
                  type: object
                  nullable: true
            example:
              success: true
              message: Subscription cancelled successfully
              data: null

      "401":
        $ref: '#/components/responses/Unauthorized'

      "404":
        description: Subscription not found
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Subscription not found
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Subscription not found
              data: null

      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Failed to cancel subscription
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Failed to cancel subscription
              data: null