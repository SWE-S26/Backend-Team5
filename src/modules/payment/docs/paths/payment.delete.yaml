/api/payment/v1/subscriptions:
  delete:
    tags:
      - Payment
    summary: Cancel the user's subscription
    description: |
      Cancels the authenticated user's subscription. 
      The cancellation can occur immediately or at the end of the billing period.

      If the user has more than 3 posted tracks, the cancellation will be rejected 
      since free users are limited to 3 tracks.

      Please call refresh token after this API to get the 
      updated subscription status in the access token claims.

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              cancelAtPeriodEnd:
                type: boolean
                description: Whether to cancel at the end of the billing period. Defaults to true if not provided.
                example: true

    responses:
      '200':
        description: Subscription cancelled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Subscription cancelled successfully
                data:
                  type: object
                  nullable: true
            example:
              success: true
              message: Subscription cancelled successfully
              data: null

      '401':
        $ref: '#/components/responses/Unauthorized'

      '403':
        description: Forbidden – user has too many tracks to cancel subscription
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: >
                    Please delete some of your posted tracks before cancelling your subscription.
                    You currently have 5 tracks and the limit for non-paying users is 3 tracks.
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: >
                Please delete some of your posted tracks before cancelling your subscription.
                You currently have 5 tracks and the limit for non-paying users is 3 tracks.
              data: null

      '404':
        description: Subscription not found
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Subscription not found
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Subscription not found
              data: null

      '500':
        $ref: '#/components/responses/ServerError'
