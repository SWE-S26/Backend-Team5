/api/payment/v1/subscriptions:
  patch:
    tags:
      - Payment
    summary: Update the user's subscription plan
    description: |
      Allows the authenticated user to upgrade or 
      downgrade their subscription by providing a new Stripe price ID.

      Please call refresh token after this API to get the 
      updated subscription status in the access token claims.

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - priceId
            properties:
              priceId:
                type: string
                description: New Stripe price ID to switch the subscription to
                example: price_1TGj1nKiCVlMQgBU9j8T38Fr

    responses:
      '200':
        description: Subscription updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Subscription updated successfully
                data:
                  type: object
                  nullable: true
            example:
              success: true
              message: Subscription updated successfully
              data: null

      '400':
        description: Invalid request – invalid price ID or missing Stripe customer
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Invalid price ID
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Invalid price ID
              data: null

      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'

      '404':
        description: Subscription not found
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Subscription not found
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Subscription not found
              data: null

      '500':
        $ref: '#/components/responses/ServerError'
