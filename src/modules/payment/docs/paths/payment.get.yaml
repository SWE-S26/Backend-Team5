/api/payment/v1/subscriptions:
  get:
    tags:
      - Payment
    summary: Get the current user's subscription
    description: Retrieves the current subscription details for the authenticated user.

    security:
      - bearerAuth: []

    responses:
      '200':
        description: Subscription retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Subscription retrieved successfully
                data:
                  type: object
                  properties:
                    plan:
                      type: string
                      example: pro_monthly
                    status:
                      type: string
                      example: active
                    currentPeriodEnd:
                      type: string
                      format: date-time
                      example: 2026-04-01T00:00:00.000Z
                    isStripePayingCustomer:
                      type: boolean
                      example: true
            example:
              success: true
              message: Subscription retrieved successfully
              data:
                plan: pro_monthly
                status: active
                currentPeriodEnd: 2026-04-01T00:00:00.000Z
                isStripePayingCustomer: true

      '401':
        $ref: '#/components/responses/Unauthorized'

      '404':
        description: Subscription not found
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Subscription not found
                data:
                  type: object
                  nullable: true
            example:
              success: false
              message: Subscription not found
              data: null

      '500':
        $ref: '#/components/responses/ServerError'
