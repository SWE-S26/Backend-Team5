# OpenAPI parameter definitions for the profile module, starting writing normally like paths

    Profile:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        profileLink:
          type: string
        profileImgLink:
          type: string
          format: uri
        bannerImgLink:
          type: string
          format: uri
        bio:
          type: string
        city:
          type: string
        country:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        bannerLinks:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        supportLink:
          type: string
          format: uri
        role:
          type: string
          enum: [Listener/Artist, Admin]
        isPaid:
          type: boolean
          description: Indicates if the user is a paid/pro user
        isPrivate:
          type: boolean          
        favoriteGenres:
          type: array
          items:
            type: string
        followersCount:
          type: integer
        followingsCount:
          type: integer
        trackCount:
          type: integer

ProfileUpdate:
  type: object
  additionalProperties: false
  properties:
    displayName:
      type: string
    firstName:
      type: string
      nullable: true
    lastName:
      type: string
      nullable: true
    profileUrl:
      type: string
    bio:
      type: string
      nullable: true
    city:
      type: string
      nullable: true
    country:
      type: string
      nullable: true
    profileImgLink:
      type: string
      format: uri
      nullable: true
    bannerImgLink:
      type: string
      format: uri
      nullable: true
    links:
      type: array
      items:
        $ref: '#/components/schemas/Link'
    bannerLinks:
      type: array
      items:
        $ref: '#/components/schemas/Link'
    supportLink:
      type: string
      format: uri
    favoriteGenres:
      type: array
      items:
        type: string

Link:
  type: object
  properties:
    linkId:
      type: string
      description: Unique identifier for the link (generated by backend)
    name:
      type: string
      nullable: true
    link:
      type: string
      format: uri

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
    code:
      type: integer

AccountSettings:
  type: object
  properties:
    theme:
      type: string
      enum: [Light, Dark, Automatic]
    dateOfBirth:
      type: string
      format: date
    gender:
      type: string
      enum: [Male, Female]

AccountSettingsUpdate:
  type: object
  properties:
    theme:
      type: string
      enum: [Light, Dark, Automatic]
    dateOfBirth:
      type: string
      format: date
    gender:
      type: string
      enum: [Male, Female]

ContentSettings:
  type: object
  properties:
    rssFeedLink:
      type: string
    rssEmailDisplayed:
      type: string
    customFieldTitle:
      type: string
    category:
      type: string
    statsServiceUrlPrefix:
      type: string
    customAuthorName:
      type: string
    language:
      type: string
    subscriberRedirect:
      type: string
    containsExplicitContent:
      type: boolean
    includeInRssFeed:
      type: boolean
    creativeCommonsLicense:
      type: boolean

ContentSettingsUpdate:
  allOf:
    - $ref: '#/components/schemas/ContentSettings'

PrivacySettings:
  type: object
  properties:
    accountIsPrivate:
      type: boolean
    allowMessagesAnyone:
      type: boolean
    showActivityDiscovery:
      type: boolean
    showFirstTopFan:
      type: boolean
    showTrackTopFans:
      type: boolean

PrivacySettingsUpdate:
  allOf:
    - $ref: '#/components/schemas/PrivacySettings'

NotificationSettings:
  type: object
  properties:
    newFollower:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    repostOfYourPost:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    newPostByFollowedUser:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    likesAndPlaysOnYourPost:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    commentOnYourPost:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    recommendedContent:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    updatesFromSoundcloud:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    soundcloudFeatureUpdatesEducation:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    surveysAndFeedback:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    promotionalPartnershipContent:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    soundcloudNewsletter:
      type: string
      enum: ['email', 'devices', 'both', 'off']
    newMessage:
      type: object
      properties:
        email:
          type: boolean
        devices:
          type: string
          enum: [everyone, followed, off]

NotificationSettingsUpdate:
  allOf:
    - $ref: '#/components/schemas/NotificationSettings'
