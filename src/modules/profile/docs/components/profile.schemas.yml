# OpenAPI parameter definitions for the profile module, starting writing normally like paths

    Profile:
      type: object
      properties:
        user_id:
          type: string
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        profile_url:
          type: string
        profile_img_link:
          type: string
          format: uri
        banner_img_link:
          type: string
          format: uri
        bio:
          type: string
        city:
          type: string
        country:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        banner_links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        support_link:
          type: string
          format: uri
        role:
          type: string
          enum: [Normal_User, Admin]
        isPaid:
          type: boolean
          description: Indicates if the user is a paid/pro user
        favorite_genres:
          type: array
          items:
            type: string
        followers_count:
          type: integer
        followings_count:
          type: integer
        track_count:
          type: integer

    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        profile_url:
          type: string
        bio:
          type: string
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        profile_img_link:
          type: string
          format: uri
          nullable: true
        banner_img_link:
          type: string
          format: uri
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        links_to_remove:
          type: array
          items:
            type: string
            description: link_id of the link to delete
        banner_links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        banner_links_to_remove:
          type: array
          items:
            type: string
            description: link_id of the banner link to delete
        support_link:
          type: string
          format: uri
        favorite_genres:
          type: array
          items:
            type: string

    Link:
      type: object
      properties:
        link_id:
          type: string
          description: Unique identifier for the link (generated by backend)
        title:
          type: string
          nullable: true
        link:
          type: string
          format: uri

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: integer