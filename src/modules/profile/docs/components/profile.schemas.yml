# OpenAPI parameter definitions for the profile module, starting writing normally like paths

    Profile:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        profileUrl:
          type: string
        profileImgLink:
          type: string
          format: uri
        bannerImgLink:
          type: string
          format: uri
        bio:
          type: string
        city:
          type: string
        country:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        bannerLinks:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        supportLink:
          type: string
          format: uri
        role:
          type: string
          enum: [Normal_User, Admin]
        isPaid:
          type: boolean
          description: Indicates if the user is a paid/pro user
        favoriteGenres:
          type: array
          items:
            type: string
        followersCount:
          type: integer
        followingsCount:
          type: integer
        trackCount:
          type: integer

    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileUrl:
          type: string
        bio:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        profileImgLink:
          type: string
          format: uri
          nullable: true
        bannerImgLink:
          type: string
          format: uri
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        linksToRemove:
          type: array
          items:
            type: string
            description: link_id of the link to delete
        bannerLinks:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        bannerLinksToRemove:
          type: array
          items:
            type: string
            description: link_id of the banner link to delete
        supportLink:
          type: string
          format: uri
        favoriteGenres:
          type: array
          items:
            type: string

    Link:
      type: object
      properties:
        linkId:
          type: string
          description: Unique identifier for the link (generated by backend)
        title:
          type: string
          nullable: true
        link:
          type: string
          format: uri

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: integer

    AccountSettings:
      type: object
      properties:
        theme:
          type: string
          enum: [Light, Dark, Automatic]
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]

    AccountSettingsUpdate:
      type: object
      properties:
        theme:
          type: string
          enum: [Light, Dark, Automatic]
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]

    ContentSettings:
      type: object
      properties:
        rssFeedLink:
          type: string
        rssEmailDisplayed:
          type: string
        customFieldTitle:
          type: string
        category:
          type: string
        statsServiceUrlPrefix:
          type: string
        customAuthorName:
          type: string
        language:
          type: string
        subscriberRedirect:
          type: string
        containsExplicitContent:
          type: boolean
        includeInRssFeed:
          type: boolean
        creativeCommonsLicense:
          type: boolean

    ContentSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/ContentSettings'

    PrivacySettings:
      type: object
      properties:
        allowMessagesAnyone:
          type: boolean
        showActivityDiscovery:
          type: boolean
        showFirstTopFan:
          type: boolean
        showTrackTopFans:
          type: boolean

    PrivacySettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/PrivacySettings'


    NotificationSettings:
      type: object
      properties:
        newFollower:
          type: string
          enum: [email, devices]
        repostOfYourPost:
          type: string
          enum: [email, devices]
        newPostByFollowedUser:
          type: string
          enum: [email, devices]
        likesAndPlaysOnYourPost:
          type: string
          enum: [email, devices]
        commentOnYourPost:
          type: string
          enum: [email, devices]
        recommendedContent:
          type: string
          enum: [email, devices]
        updatesFromSoundcloud:
          type: string
          enum: [email, devices]
        soundcloudFeatureUpdatesEducation:
          type: string
          enum: [email, devices]
        surveysAndFeedback:
          type: string
          enum: [email, devices]
        promotionalPartnershipContent:
          type: string
          enum: [email, devices]
        soundcloudNewsletter:
          type: string
          enum: [email, devices]
        newMessage:
          type: object
          properties:
            email:
              type: boolean
            devices:
              type: string
              enum: [everyone, followed, off]

    NotificationSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/NotificationSettings'