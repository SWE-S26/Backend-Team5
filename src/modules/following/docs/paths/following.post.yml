api/social/follow/{userId}:
  post:
    tags:
      - Social
    summary: Follow a user
    description: Authenticated user follows another user
    operationId: followUser
    parameters:
      - name: userId
        in: path
        required: true
        description: User ID to follow
        schema:
          type: string
    responses:
      '200':
        description: Follow successful
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSummery'
      '400':
        description: Invalid user ID
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            examples:
              invalidId:
                value:
                  success: false
                  message: "Invalid user ID"
                  code: 400
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            examples:
              unauthorized:
                value:
                  success: false
                  message: "Unauthorized"
                  code: 401
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            examples:
              notFound:
                value:
                  success: false
                  message: "User not found"
                  code: 404

