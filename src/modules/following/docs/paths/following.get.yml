    summary: Get suggested users
    description: Returns a list of users suggested for the authenticated user to follow
    operationId: getSuggestedUsers
    parameters:
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam' 
    responses:
      '200':
        description: Suggested users retrieved
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UserSummary'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            examples:
              unauthorized:
                value:
                  success: false
                  message: "Unauthorized"
                  code: 401

/api/social/v1/blocked:
