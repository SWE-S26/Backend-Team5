# OpenAPI parameter definitions for the following module, starting writing normally like paths

    UserSummary:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        profileImgLink:
          type: string
          format: uri
        trackCount:
          type: integer
        followersCount:
          type: integer
          description: Number of tracks uploaded by the user
    ActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/UserSummary'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: integer          