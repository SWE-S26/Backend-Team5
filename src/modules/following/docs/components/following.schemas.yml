# OpenAPI parameter definitions for the following module, starting writing normally like paths

    UserSummary:
      type: object
      properties:
        user_id:
          type: string
        display_name:
          type: string
        profile_img_link:
          type: string
          format: uri
        track_count:
          type: integer
          description: Number of tracks uploaded by the user
    ActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/UserSummary'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: integer          