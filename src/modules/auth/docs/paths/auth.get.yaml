# GET
/api/auth/v1/verify-email:
  get:
    tags:
      - Authentication
    summary: Verify a user's email address
    description: |
      Confirms the user's email by validating the verification token sent in the email.
      If the token is valid, the user's account is marked as verified.
    parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: The email verification token sent to the user's email
    responses:
      200:
        description: Successfully Verified User Email.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'User Verified successfully'
            example:
              message: 'Email Verified Successfully'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      410:
        $ref: '#/components/responses/Gone'
      500:
        $ref: '#/components/responses/ServerError'
/api/auth/v1/cross/desktop:
  get:
    tags:
      - Authentication
    summary: Generate QR code for cross-device login
    description: |
      Generates a QR code that allows a user to authenticate on a desktop
      by scanning it with a logged-in mobile device.

      The QR code contains a temporary token stored on the server.
      The token expires after a short period for security reasons.

      The desktop client should display the QR code and start polling
      the server to check whether the user has approved the login from
      their mobile device.

    responses:
      '200':
        description: QR code generated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'QR Code generated successfully'
                pendingToken:
                  type: string
                  description: Encoded QR code value used for cross-device authentication
                  example: 'qr_abc123xyz'
      '500':
        $ref: '#/components/responses/ServerError'
/api/auth/v1/logout:
  get:
    tags:
      - Authentication
    summary: Log out the current user
    description: |
      Logs out the currently authenticated user by invalidating the session or JWT token
      and clearing the HTTP-only authentication cookie. This prevents further access
      to protected resources until the user logs in again.
    responses:
      200:
        description: Logged out successfully
        content:
          application/json:
            examples:
              web_client:
                summary: Web — cookies cleared
                value:
                  message: 'User Logged Out Successfully'
              mobile_client:
                summary: Mobile — null tokens returned in body
                value:
                  message: 'User Logged Out Sucessfully'
                  data:
                    acessToken: null
                    refreshToken: null
      401:
        $ref: '#/components/responses/Unauthorized'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/refresh-token:
  get:
    tags:
      - Authentication
    summary: Refresh the JWT access token
    description: |
      Issues a new JWT access token using a valid refresh token. This allows the user
      to remain authenticated without re-entering credentials. The new token is
      typically sent in an HTTP-only cookie to enhance security and prevent XSS attacks.
    responses:
      200:
        description: Token refreshed successfully
        content:
          application/json:
            examples:
              web_client:
                summary: Web — tokens delivered via cookies
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                      accessToken: 'eyJhbGci...'
                      refreshToken: 'eyJhbGci...'
              mobile_client:
                summary: Mobile — tokens delivered in body
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                    accessToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.access123'
                    refreshToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.refresh456'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/ServerError'
/api/auth/v1/google:
  get:
    tags:
      - Authentication
    summary: Initiate Google OAuth sign-in
    description: |
      Redirects the user to Google's consent screen to authenticate.
      This endpoint is browser-only — do not call it from Postman or a REST client.
      Google will redirect back to /api/auth/v1/google/callback upon completion.
    responses:
      302:
        description: Redirects to Google consent screen
        headers:
          Location:
            schema:
              type: string
              example: 'https://accounts.google.com/o/oauth2/v2/auth?...'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/google/callback:
  get:
    tags:
      - Authentication
    summary: Google OAuth callback
    description: |
      Called automatically by Google after the user grants consent.
      **Do not call this endpoint directly — Google calls it internally as part of the OAuth flow.**

      This endpoint always responds with an **HTTP redirect** (302). There is no JSON response body.
      The redirect destination and its query parameters differ based on the user's state:

      ---

      ### Case 1 — New User (`/oauth-continue-details`)
      The user has never signed in before and has no account.

      **Redirects to:** `{HOST_URL}/oauth-continue-details`

      **Query parameters appended to the redirect URL:**
      | Parameter | Description |
      |---|---|
      | `incompleteToken` | Short-lived JWT (15 min) carrying `googleId`, `email`, `displayName`. Must be sent back to `/google/complete`. |
      | `email` | The user's Google email — provided for UI pre-fill convenience. |
      | `displayName` | The user's Google display name — provided for UI pre-fill convenience. |

      **Example redirect URL:**
      https://beatza.me/oauth-continue-details?incompleteToken=eyJhbGci...&email=user@example.com&displayName=John%20Doe

      **What to do:** Collect `dateOfBirth` and `gender` from the user, then POST all three fields
      (including the `incompleteToken`) to `/api/auth/v1/google/complete`.

      ---

      ### Case 2 — Existing User, First Google Sign-In (`/verify-code`)
      The user has an account created via email/password and is signing in with Google for the first time.
      A 6-digit verification code is sent to their email.

      **Redirects to:** `{HOST_URL}/verify-code`

      **Query parameters appended to the redirect URL:**
      | Parameter | Description |
      |---|---|
      | `pendingToken` | Short-lived JWT (5 min) carrying `userId`, `role`, `subscription`. Must be sent back to `/google/verify-code` alongside the emailed code. |

      **Example redirect URL:**
      https://beatza.me/verify-code?pendingToken=eyJhbGci...

      **What to do:** Ask the user for the 6-digit code from their email, then POST `{ pendingToken, code }`
      to `/api/auth/v1/google/verify-code`.

      ---

      ### Case 3 — Returning Google User (`/home`)
      The user has previously signed in with Google and their account is already linked.
      No additional steps are needed.

      In case of anriods
      Redirects to `{HOST_URL}/cross-callback`.

      For **Android clients** the redirect URL also includes:
      | Parameter | Description |
      |---|---|
      | `accessToken` | Short-lived access JWT for mobile web-view use |
      | `refreshToken` | Long-lived refresh JWT for mobile web-view use |

      **Redirects to:** `{HOST_URL}/home`

      **Query parameters appended to the redirect URL:**
      | Parameter | Description |
      |---|---|
      | `accessToken` | Short-lived access JWT. Intended for **mobile clients using a web-view** that cannot read HTTP-only cookies. Web clients should ignore this and rely on the cookies instead. |
      | `refreshToken` | Long-lived refresh JWT. Same note as above — for mobile web-view use only. |

      **Example redirect URL:**
      https://beatza.me/home?accessToken=eyJhbGci...&refreshToken=eyJhbGci...

      In addition to the query parameters, two **HTTP-only cookies** are set on the response:
      | Cookie | Max-Age |
      |---|---|
      | `accessToken` | 1 hour |
      | `refreshToken` | 7 days |

      **What to do:**
      - **Web clients** — read tokens from the HTTP-only cookies (browser handles this automatically). Ignore the query parameters.
      - **Mobile clients (web-view)** — read `accessToken` and `refreshToken` from the redirect URL's query string and store them in your secure store. Discard them from the URL immediately after reading.

      > **Note:** The redirect does not carry user details beyond the tokens. If you need full user details
      > on first load (e.g. display name, profile image, subscription), call
      > `GET /api/auth/v1/refresh-token` after authentication — it acts as a cold-start endpoint
      > that returns both fresh tokens and the user's profile details.

    parameters:
      - in: query
        name: code
        required: true
        schema:
          type: string
        description: Authorization code issued by Google — appended automatically by Google, not by the client.
      - in: query
        name: scope
        required: false
        schema:
          type: string
        description: Scopes granted by the user — appended automatically by Google.

    responses:
      302:
        description: |
          Redirect issued. Destination depends on the user's state — see endpoint description above.
        headers:
          Location:
            schema:
              type: string
            description: |
              One of:
              - `{HOST_URL}/oauth-continue-details?incompleteToken=...&email=...&displayName=...`
              - `{HOST_URL}/verify-code?pendingToken=...`
              - `{HOST_URL}/home?accessToken=...&refreshToken=...`
          Set-Cookie:
            schema:
              type: string
            description: |
              Only set in Case 3 (returning Google user):
              - `accessToken` — HTTP-only, Secure, SameSite=Strict, Max-Age=3600
              - `refreshToken` — HTTP-only, Secure, SameSite=Strict, Max-Age=604800
      400:
        $ref: '#/components/responses/BadRequest'
      403:
        $ref: '#/components/responses/Forbidden'
      500:
        $ref: '#/components/responses/ServerError'
