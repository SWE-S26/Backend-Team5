# GET
/api/auth/v1/verify-email:
  get:
    tags:
      - Authentication
    summary: Verify a user's email address
    description: |
      Confirms the user's email by validating the verification token sent in the email.
      If the token is valid, the user's account is marked as verified.
    parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: The email verification token sent to the user's email
    responses:
      200:
        description: Successfully Verified User Email.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'User Verified successfully'
            example:
              message: 'User Verified successfully'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      410:
        $ref: '#/components/responses/Gone'
      500:
        $ref: '#/components/responses/ServerError'
/api/auth/v1/cross/desktop:
  get:
    tags:
      - Authentication
    summary: Generate QR code for cross-device login
    description: |
      Generates a QR code that allows a user to authenticate on a desktop
      by scanning it with a logged-in mobile device.

      The QR code contains a temporary token stored on the server.
      The token expires after a short period for security reasons.

      The desktop client should display the QR code and start polling
      the server to check whether the user has approved the login from
      their mobile device.

    responses:
      '200':
        description: QR code generated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'QR code generated successfully'
                data:
                  type: object
                  properties:
                    qrCode:
                      type: string
                      description: Encoded QR code value used for cross-device authentication
                      example: 'qr_abc123xyz'
                    expiresIn:
                      type: integer
                      description: Expiration time of the QR code in seconds
                      example: 120

      '500':
        $ref: '#/components/responses/ServerError'
/api/auth/v1/logout:
  get:
    tags:
      - Authentication
    summary: Log out the current user
    description: |
      Logs out the currently authenticated user by invalidating the session or JWT token
      and clearing the HTTP-only authentication cookie. This prevents further access
      to protected resources until the user logs in again.
    responses:
      200:
        description: Logged out successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Logged out successfully'
                data:
                  type: object
                  nullable: true
            example:
              message: 'Logged out successfully'
              data: null
      401:
        $ref: '#/components/responses/Unauthorized'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/refresh-token:
  get:
    tags:
      - Authentication
    summary: Refresh the JWT access token
    description: |
      Issues a new JWT access token using a valid refresh token. This allows the user
      to remain authenticated without re-entering credentials. The new token is
      typically sent in an HTTP-only cookie to enhance security and prevent XSS attacks.
    responses:
      200:
        description: Token refreshed successfully
        content:
          application/json:
            examples:
              web_client:
                summary: Web — tokens delivered via cookies
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener/Artist'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
              mobile_client:
                summary: Mobile — tokens delivered in body
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener/Artist'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                    accessToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.access123'
                    refreshToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.refresh456'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/ServerError'
/api/auth/v1/google:
  get:
    tags:
      - Authentication
    summary: Initiate Google OAuth sign-in
    description: |
      Redirects the user to Google's consent screen to authenticate.
      This endpoint is browser-only — do not call it from Postman or a REST client.
      Google will redirect back to /api/auth/v1/google/callback upon completion.
    responses:
      302:
        description: Redirects to Google consent screen
        headers:
          Location:
            schema:
              type: string
              example: 'https://accounts.google.com/o/oauth2/v2/auth?...'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/google/callback:
  get:
    tags:
      - Authentication
    summary: Google OAuth callback
    description: |
      This endpoint is called automatically by Google after the user grants consent.
      Do not call this endpoint directly.

      Returns one of two shapes depending on whether the user exists in the system:

      - **new user** — returns `status: incomplete` with an `incompleteToken`. 
        Frontend must collect `dateOfBirth` and `gender`, then POST to `/google/complete`.

      - **existing user** — returns `status: verify` with a `pendingToken`.
        A 6-digit verification code is sent to the user's email.
        Frontend must POST that code to `/google/verify-code`.

      - **user who used sign with google before** -returns 'status:returning_google' 
        with an access token and refresh token, and the frontend should log them in directly without asking for verification code or profile completion.
    parameters:
      - in: query
        name: code
        required: true
        schema:
          type: string
        description: Authorization code issued by Google — sent automatically, not by the client
      - in: query
        name: scope
        required: false
        schema:
          type: string
        description: Scopes granted by the user — sent automatically by Google
    responses:
      200:
        description: Google authentication successful
        content:
          application/json:
            schema:
              oneOf:
                - title: New User
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [incomplete]
                    incompleteToken:
                      type: string
                      description: Short-lived JWT (15min) carrying googleId, email, displayName. Send back in /google/complete.
                    email:
                      type: string
                    displayName:
                      type: string
                  required: [status, incompleteToken, email, displayName]
                - title: Existing User
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [verify]
                    pendingToken:
                      type: string
                      description: Short-lived JWT (5min) carrying userId, role, subscription. Send back in /google/verify-code alongside the emailed code.
                  required: [status, pendingToken]
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [returning_google]
                    message:
                      type: string
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserCredientialsResponseDto'
                        accessToken:
                          type: string
                        refreshToken:
                          type: string
                  required: [status, message, data]

            examples:
              new_user:
                summary: New user — needs profile completion
                value:
                  status: incomplete
                  incompleteToken: 'eyJhbGciOi...'
                  email: 'user@example.com'
                  displayName: 'John Doe'

              existing_user:
                summary: Existing user — verification required
                value:
                  status: verify
                  pendingToken: 'eyJhbGciOi...'

              returning_google_web:
                summary: Returning Google user (web)
                value:
                  status: returning_google
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener/Artist'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0

              returning_google_mobile:
                summary: Returning Google user (mobile)
                value:
                  status: returning_google
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener/Artist'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                    accessToken: 'eyJhbGciOi...'
                    refreshToken: 'eyJhbGciOi...'
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        $ref: '#/components/responses/Unauthorized'
      500:
        $ref: '#/components/responses/ServerError'
