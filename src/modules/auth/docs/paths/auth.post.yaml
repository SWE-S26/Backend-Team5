# POST
/api/auth/v1/login:
  post:
    tags:
      - Authentication
    summary: Authenticate user and return access token
    description: |
      Authenticates user credentials and, upon success, generates a JWT access token stored in a secure, HTTP-only cookie. The cookie is sent automatically with each HTTPS request, preventing access from client-side scripts and enhancing protection against XSS attacks.
      For Android clients, pass `?client=Android` as a query parameter.
      Instead of cookies, the server redirects to:
      `{HOST_URL}/cross-callback?accessToken=...&refreshToken=...`
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                description: The email address of the user
                example: user@example.com
              password:
                type: string
                description: The user's password (minimum 8 characters, including at least one uppercase letter and one special character)
                example: Password@123
    responses:
      200:
        description: User logged in successfully
        headers:
          Set-Cookie:
            description: |
              Two HTTP-only cookies are set for web clients:
              - `accessToken` (1 hour)
              - `refreshToken` (7 days, scoped to /api/auth/v1/refresh-token)
            schema:
              type: string
        content:
          application/json:
            examples:
              web_client:
                summary: Web — tokens delivered via cookies
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                      accessToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.access123'
                      refreshToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.refresh456'
              mobile_client:
                summary: Mobile — tokens delivered in body
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                    accessToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.access123'
                    refreshToken: 'eyJhbGciO.eyNTYiLCJpYXQiOjE2ODg3NjQ4MDAsImV4cCI6MTY4ODc3ODQwMH0.refresh456'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/sign-up:
  post:
    tags:
      - Authentication
    summary: Register a new user and send a verification email
    description: |
      Registers a new user by collecting essential information such as email, password, display name, date of birth, and gender.
      Upon successful registration
      A verification email is sent to the user's email address to confirm their account.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
              - displayName
              - dateOfBirth
              - Gender
            properties:
              email:
                type: string
                description: The user's email address, which will be used to log in and receive verification
                example: user@example.com
              password:
                type: string
                description: >
                  The user's password. Must be at least 8 characters long and include
                  at least one uppercase letter, one lowercase letter, and one special character.
                example: Password@123
              displayName:
                type: string
                description: The name displayed on the user's profile
                example: John Doe
              dateOfBirth:
                type: string
                format: date
                description: The user's date of birth in ISO format (YYYY-MM-DD)
                example: 1990-01-01
              Gender:
                type: string
                description: The user's gender (No support for mfer gays)
                enum:
                  - Male
                  - Female
                example: Male
    responses:
      200:
        description: Signup Successful
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'User Signed Up Sucessfully'
            example:
              message: 'User Signed Up Sucessfully'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/forgot-password:
  post:
    tags:
      - Authentication
    summary: Request a password reset link
    description: |
      Sends a password reset email to the user. The user must provide their registered email address.
      If the email exists in the system, a secure, time-limited password reset link is sent to that email.
      This allows the user to securely reset their password without exposing credentials.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                description: The registered email address of the user requesting a password reset
                example: user@example.com
    responses:
      200:
        description: Password reset email sent successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Password reset email sent successfully'
            example:
              message: 'Password reset email sent successfully'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/reset-password:
  post:
    tags:
      - Authentication
    summary: Reset a user's password using the token from email
    description: |
      Allows a user to reset their password by providing the password reset token
      received via email and a new password. The token is validated for authenticity
      and expiration. Upon success, the user's password is updated securely.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - token
              - newPassword
            properties:
              token:
                type: string
                description: The password reset token sent to the user's email
                example: abc123xyz
              newPassword:
                type: string
                description: The new password for the user's account. Must meet password policy requirements (e.g., minimum 8 characters, uppercase, special character)
                example: NewPassword@123
    responses:
      200:
        description: Password reset successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: 'Password reset successfully'
                data:
                  type: object
                  nullable: true
            example:
              success: true
              message: 'Password reset successfully'
              data: null
      400:
        description: Token valid but password reset failed
        content:
          application/json:
            example:
              message: 'Failed to reset password'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/find-email:
  post:
    tags:
      - Authentication
    summary: Check if an email exists in the system
    description: |
      Verifies whether the provided email address exists in the database.
      This endpoint is typically used before password reset or registration
      to confirm if the email is already associated with an account.

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                description: Email address to check in the system
                example: user@example.com

    responses:
      200:
        description: Email existence check completed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Email existence check completed successfully'
                data:
                  type: object
                  properties:
                    exists:
                      type: boolean
                      description: Indicates whether the email exists in the database
                      example: true
            example:
              message: 'Email Checked Successfully'
              data:
                exists: true
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/resend-verification-email:
  post:
    tags:
      - Authentication
    summary: Resend email verification link
    description: |
      Resends the email verification link to the user's registered email address.
      Use this when the original verification email was lost or expired.

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                description: Email address to check in the system
                example: user@example.com

    responses:
      200:
        description: Email existence check completed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  example: 'Email Resent successfully!'
            example:
              message: 'Email existence check completed successfully'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/google/verify-code:
  post:
    tags:
      - Authentication
    summary: Verify Google sign-in code and authenticate user
    description: |
      Completes sign-in for an existing user who authenticated via Google for the first time.

      After the Google callback redirects to `/verify-code`, a 6-digit code is sent to the user's email.
      Read `pendingToken` from the redirect URL's query string, collect the code from the user,
      then POST both here.

      The code is one-time use and expires in **5 minutes**.

      On success, the response differs by client type:
      - **Web clients** — tokens are set as HTTP-only cookies. The response body contains only user details.
      - **Mobile clients (web-view)** — tokens are included in the response body in addition to being set
        as cookies, since web-views cannot access HTTP-only cookies directly. Read them from the body
        and store them in your secure store.

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - pendingToken
              - code
            properties:
              pendingToken:
                type: string
                description: Short-lived JWT from Google callback step
                example: 'eyJhbGciOi...'
              code:
                type: string
                description: 6-digit verification code sent to email
                example: '123456'

    responses:
      200:
        description: User authenticated successfully
        headers:
          Set-Cookie:
            description: |
              Two HTTP-only cookies are set for web clients:
              - `accessToken` (1 hour)
              - `refreshToken` (7 days)
            schema:
              type: string

        content:
          application/json:
            examples:
              web_client:
                summary: Web — tokens via cookies ignore tokens in body
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                      accessToken: 'eyJhbGciOi...'
                      refreshToken: 'eyJhbGciOi...'

              mobile_client:
                summary: Mobile — tokens in body
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                    accessToken: 'eyJhbGciOi...'
                    refreshToken: 'eyJhbGciOi...'

      400:
        $ref: '#/components/responses/InvalidParameters'
      401:
        $ref: '#/components/responses/Unauthorized'
      410:
        $ref: '#/components/responses/Gone'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/google/resend-code:
  post:
    tags:
      - Authentication
    summary: Resend verification code for Google sign-in
    description: |
      The SAME verification is resent to the user's email if they request it again 
      within the 5-minute validity window. 
      This allows users to receive a new code 
      if they missed or lost the original email without having to restart the Google sign-in process.

      **THIS DOES NOT EXTEND THE 5 MINUTE WINDOW!!!**

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - pendingToken
            properties:
              pendingToken:
                type: string
                description: Short-lived JWT from Google callback step
                example: 'eyJhbGciOi...'

    responses:
      200:
        description: Verification code resent
        content:
          application/json:
            example:
              message: 'Verification code resent successfully'
      400:
        $ref: '#/components/responses/InvalidParameters'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      410:
        $ref: '#/components/responses/Gone'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/google/complete:
  post:
    tags:
      - Authentication
    summary: Complete Google sign-up for new users
    description: |
      Final step for users who signed in with Google but do not yet have a complete account.

      The client must send:
      - `incompleteToken` (from Google callback)
      - `dateOfBirth`
      - `gender`

      On success:
      - A new user is created
      - User is authenticated immediately
      - Response is identical to `api/auth/v1/login`

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - incompleteToken
              - dateOfBirth
              - gender
            properties:
              incompleteToken:
                type: string
                description: Short-lived JWT from Google callback
                example: 'eyJhbGciOi...'
              dateOfBirth:
                type: string
                format: date
                description: Must be >= 13 years old
                example: '1990-05-15'
              gender:
                type: string
                enum: [Male, Female]
                example: 'Male'
              displayName:
                type: string
                example: 'I AM YOUR DADDY'

    responses:
      201:
        description: User created and authenticated successfully
        headers:
          Set-Cookie:
            description: |
              Two HTTP-only cookies are set for web clients:
              - `accessToken` (1 hour)
              - `refreshToken` (7 days)
            schema:
              type: string

        content:
          application/json:
            examples:
              web_client:
                summary: Web — tokens via cookies Ignore tokens in body
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                      accessToken: 'eyJhbGciOi...'
                      refreshToken: 'eyJhbGciOi...'

              mobile_client:
                summary: Mobile — tokens in body
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                    accessToken: 'eyJhbGciOi...'
                    refreshToken: 'eyJhbGciOi...'

      400:
        $ref: '#/components/responses/InvalidParameters'

      401:
        $ref: '#/components/responses/Unauthorized'

      410:
        description: Incomplete token expired
        content:
          application/json:
            example:
              success: false
              message: 'Incomplete sign-up token expired'
              data: null

      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/cross/mobile:
  post:
    tags:
      - Authentication
    summary: Approve cross-device login from mobile
    description: |
      Allows a logged-in mobile user to approve a login request for a
      desktop device by scanning the QR code.

      The user's JWT must be sent in the Authorization header.
      If the QR code is valid and not expired, the login request will
      be approved for the desktop device.

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - qrCode
            properties:
              qrCode:
                type: string
                description: QR code value scanned from the desktop screen
                example: qr_abc123xyz

    responses:
      200:
        description: Cross-device login approved
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Login approved successfully'
                data:
                  type: object
                  nullable: true
            example:
              message: 'Login approved successfully'
              data: null
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/auth/v1/cross/desktop/poll:
  post:
    tags:
      - Authentication
    summary: Poll login status for QR authentication
    description: |
      The desktop client periodically calls this endpoint to check whether
      the mobile user has approved the login request.

      If the login is approved, a JWT is returned and stored in a secure
      HTTP-only cookie.

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - qrCode
            properties:
              qrCode:
                type: string
                description: QR code value generated for the desktop session
                example: qr_abc123xyz

    responses:
      200:
        description: Login successful
        content:
          application/json:
            examples:
              web_client_waiting:
                summary: Web — waiting for approval
                value:
                  message: 'QR Code not yet scanned.'
              web_client_success:
                summary: Web — tokens delivered via cookies
                value:
                  message: 'Authenticated successfully'
                  data:
                    user:
                      id: '69b801097eabbb6c286e6455'
                      displayName: 'Naaauuuh This is too much'
                      role: 'Listener'
                      profileLink: 'https://example.com/profiles/69b801097eabbb6c286e6455'
                      profileImg:
                        imgLink: 'https://res.cloudinary.com/dexluedse/image/upload/v1744719629/mobile-app/lwvswk21xn3wpgoufqxi.jpg'
                        publicId: 'mobile-app/lwvswk21xn3wpgoufqxi'
                      subscription:
                        subscriptionType: 'free'
                        quota:
                          unlimited: false
                          usedSeconds: 0
                    accessToken: 'eyJhbGciOi...'
                    refreshToken: 'eyJhbGciOi...'

      400:
        $ref: '#/components/responses/InvalidParameters'
      410:
        $ref: '#/components/responses/Gone'
      500:
        $ref: '#/components/responses/ServerError'
