/example:
  get:
    tags:
      - Examples
    summary: Get agent profile by ID.
    description: Returns the agent profile associated with the provided ID.
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    responses:
      200:
        description: Successfully retrieved agent profile.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUserByIdResponseDTO'

      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/Another/example:
  get:
    tags:
      - Examples
    summary: Get agent profile by ID.
    description: Returns the agent profile associated with the provided ID.
    parameters:
      - name: id
        in: path
        required: true
        description: Agent unique identifier
        schema:
          type: string
          example: '64b8f3a9c12e4d001a9f1234'
    responses:
      200:
        description: Successfully retrieved agent profile.
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/GetUserByIdResponseDTO'
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/Example/example/example:
  get:
    summary: Get calls by phone number
    description: Retrieves a list of calls for the specified phone number.
    tags:
      - Examples
    parameters:
      - name: phone
        in: path
        required: true
        schema:
          type: string
        description: Phone number to search
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      200:
        description: Calls retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Agent'
                meta:
                  type: object
                  properties:
                    limit:
                      type: integer
                    offset:
                      type: integer
                    count:
                      type: integer
      401:
        $ref: '#/components/responses/Unauthorized'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/users:
  get:
    tags:
      - Examples
    summary: List users
    parameters:
      - $ref: '#/components/parameters/PageQueryParam'
      - $ref: '#/components/parameters/LimitQueryParam'
    responses:
      200:
        description: List of users
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Agent'
