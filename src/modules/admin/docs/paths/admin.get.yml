# GET paths for admin module

/api/admin/v1/users:
  get:
    tags:
      - Admin Users
    summary: List all users.
    description: Returns a paginated list of users for admins. Supports filtering by role, suspended state, and a single search query that matches displayName or email.
    operationId: adminListUsers
    parameters:
      - $ref: '#/components/parameters/AdminOffsetParam'
      - $ref: '#/components/parameters/AdminLimitParam'
      - $ref: '#/components/parameters/AdminUserRoleParam'
      - $ref: '#/components/parameters/AdminSuspendedParam'
      - $ref: '#/components/parameters/AdminUserSearchQueryParam'
    responses:
      200:
        description: Paginated list of users.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserListResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/Forbidden'
      500:
        $ref: '#/components/responses/ServerError'

/api/admin/v1/media:
  get:
    tags:
      - Admin Media
    summary: List tracks.
    description: Returns a paginated list of tracks for admins. Supports search by track title or artist name.
    operationId: adminListMedia
    parameters:
      - $ref: '#/components/parameters/AdminOffsetParam'
      - $ref: '#/components/parameters/AdminLimitParam'
      - $ref: '#/components/parameters/AdminMediaSearchQueryParam'
    responses:
      200:
        description: Paginated list of tracks.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMediaListResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/Forbidden'
      500:
        $ref: '#/components/responses/ServerError'

/api/admin/reports:
  get:
    tags:
      - Admin Reports
    summary: List all reports.
    description: Returns a paginated list of all submitted reports. Supports filtering by status, complaint type, and violator type. Admin only.
    operationId: adminListReports
    parameters:
      - $ref: '#/components/parameters/AdminOffsetParam'
      - $ref: '#/components/parameters/AdminLimitParam'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - pending
            - resolved
            - dismissed
      - name: complaintType
        in: query
        required: false
        schema:
          type: string
    responses:
      200:
        description: Paginated list of reports.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportListResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/Forbidden'
      500:
        $ref: '#/components/responses/ServerError'

/api/admin/reports/{reportId}:
  get:
    tags:
      - Admin Reports
    summary: Get a single report.
    description: Returns the full detail of a specific report. Admin only.
    operationId: adminGetReport
    parameters:
      - $ref: '#/components/parameters/AdminReportIdParam'
    responses:
      200:
        description: Report details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/Forbidden'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/ServerError'

/api/admin/v1/analytics/overview:
  get:
    tags:
      - Admin Analytics
    summary: Platform analytics overview.
    description: Returns a platform-level overview for admins, including user counts, pro-to-listeners ratio, total tracks, and total plays.
    operationId: adminGetAnalyticsOverview
    responses:
      200:
        description: Platform analytics overview.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAnalyticsOverviewResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/Forbidden'
      500:
        $ref: '#/components/responses/ServerError'

/api/admin/v1/analytics/storage:
  get:
    tags:
      - Admin Analytics
    summary: Platform storage usage.
    description: Returns total audio storage usage for admins by summing file sizes from Publitio files list API.
    operationId: adminGetAnalyticsStorage
    responses:
      200:
        description: Platform storage usage.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAnalyticsStorageResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      403:
        $ref: '#/components/responses/Forbidden'
      500:
        $ref: '#/components/responses/ServerError'

/api/admin/v1/artist-analytics/me:
  get:
    tags:
      - Artist Analytics
    summary: Get the authenticated artist analytics.
    description: Returns total plays, reposts, downloads, likes, and comments across all tracks uploaded by the authenticated user.
    operationId: getArtistAnalytics
    responses:
      200:
        description: Artist analytics summary.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistAnalyticsResponse'
      401:
        $ref: '#/components/responses/Unauthorized'
      500:
        $ref: '#/components/responses/ServerError'
