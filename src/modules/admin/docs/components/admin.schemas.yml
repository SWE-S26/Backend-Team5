# ─── Section 1: User Moderation ──────────────────────────────────────────

AdminUserSnippet:
  type: object
  description: Core user information visible to admins.
  properties:
    userId:
      type: string
      example: 'usr_001'
    displayName:
      type: string
      example: 'John Doe'
    email:
      type: string
      format: email
      example: 'john.doe@example.com'
    role:
      type: string
      enum:
        - Listener
        - Artist
        - Pro
        - Admin
      example: 'Listener'
    suspended:
      type: boolean
      example: false
    createdAt:
      type: string
      format: date-time
      example: '2025-01-10T09:00:00Z'
    uploadedTracksCount:
      type: integer
      minimum: 0
      example: 12
    followersCount:
      type: integer
      minimum: 0
      example: 95
  required:
    - userId
    - displayName
    - email
    - role
    - suspended
    - createdAt
    - uploadedTracksCount
    - followersCount

AdminUserListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 500
    offset:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    users:
      type: array
      items:
        $ref: '#/components/schemas/AdminUserSnippet'
  required:
    - total
    - offset
    - limit
    - users

SuspendRequest:
  type: object
  properties:
    reason:
      type: string
      maxLength: 500
      example: 'Violation of community guidelines.'
  required:
    - reason

# ─── Section 2: Reports ───────────────────────────────────────────────────

CreateReportRequest:
  type: object
  properties:
    violatorId:
      type: string
      example: '507f1f77bcf86cd799439012'
    violatorType:
      type: string
      enum:
        - user
        - track
      example: 'track'
    reason:
      type: string
      maxLength: 2000
      example: 'This track contains abusive content.'
  required:
    - violatorId
    - violatorType
    - reason

Report:
  type: object
  properties:
    reportId:
      type: string
      example: '507f1f77bcf86cd799439013'
    reportedId:
      type: string
      example: '507f1f77bcf86cd799439011'
    violatorId:
      type: string
      example: '507f1f77bcf86cd799439012'
    violatorType:
      type: string
      enum:
        - user
        - track
      example: 'track'
    reason:
      type: string
      example: 'This track contains abusive content.'
    status:
      type: string
      enum:
        - pending
        - done
      example: 'pending'
    createdAt:
      type: string
      format: date-time
      example: '2025-01-12T08:00:00Z'
  required:
    - reportId
    - reportedId
    - violatorId
    - violatorType
    - reason
    - status
    - createdAt

ReportListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 30
    offset:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    reports:
      type: array
      items:
        $ref: '#/components/schemas/ReportListItem'
  required:
    - total
    - offset
    - limit
    - reports

ReportListItem:
  allOf:
    - $ref: '#/components/schemas/Report'
    - type: object
      properties:
        reporterDisplayName:
          type: string
          example: 'John Doe'
      required:
        - reporterDisplayName

UpdateReportStatusRequest:
  type: object
  properties:
    status:
      type: string
      enum:
        - resolved
        - dismissed
      example: 'resolved'
    adminNote:
      type: string
      maxLength: 1000
      example: 'Content was removed after review.'
  required:
    - status

# ─── Section 3: Track Management ──────────────────────────────────────────

AdminTrackSnippet:
  type: object
  description: Track information visible to admins.
  properties:
    trackId:
      type: string
      example: 'trk_456'
    title:
      type: string
      example: 'Summer Vibes'
    artistName:
      type: string
      example: 'DJ Cool'
    genre:
      type: string
      example: 'Electronic'
    visibility:
      type: string
      enum:
        - public
        - private
      example: 'public'
    hidden:
      type: boolean
      example: false
    createdAt:
      type: string
      format: date-time
      example: '2025-01-05T14:00:00Z'
  required:
    - trackId
    - title
    - artistName
    - visibility
    - hidden
    - createdAt

AdminTrackListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 200
    offset:
      type: integer
      example: 0
    limit:
      type: integer
      example: 20
    tracks:
      type: array
      items:
        $ref: '#/components/schemas/AdminTrackSnippet'
  required:
    - total
    - offset
    - limit
    - tracks

AdminMediaSnippet:
  type: object
  description: Track information visible to admins.
  properties:
    title:
      type: string
      example: 'Summer Vibes'
    artistName:
      type: string
      example: 'DJ Cool'
    type:
      type: string
      enum:
        - track
      example: 'track'
    numberOfPlays:
      type: integer
      minimum: 0
      example: 1200
    numberOfLikes:
      type: integer
      minimum: 0
      example: 540
    banned:
      type: boolean
      example: false
    createdAt:
      type: string
      format: date-time
      example: '2025-01-05T14:00:00Z'
  required:
    - title
    - artistName
    - type
    - numberOfPlays
    - numberOfLikes
    - banned
    - createdAt

AdminMediaListResponse:
  type: object
  properties:
    total:
      type: integer
      example: 200
    offset:
      type: integer
      example: 1
    limit:
      type: integer
      example: 20
    items:
      type: array
      items:
        $ref: '#/components/schemas/AdminMediaSnippet'
  required:
    - total
    - offset
    - limit
    - items

AdminActionReasonRequest:
  type: object
  properties:
    reason:
      type: string
      maxLength: 500
      example: 'Content violates community guidelines.'

# ─── Section 4: Analytics (Admin) ────────────────────────────────────────

AdminAnalyticsOverviewResponse:
  type: object
  properties:
    totalUsers:
      type: integer
      example: 1520
    proToListenersRatio:
      type: number
      format: float
      example: 0.08
    totalTracks:
      type: integer
      example: 420
    totalPlays:
      type: integer
      example: 50000
  required:
    - totalUsers
    - proToListenersRatio
    - totalTracks
    - totalPlays

AdminAnalyticsStorageResponse:
  type: object
  properties:
    usedBytes:
      type: integer
      example: 524288000
  required:
    - usedBytes

ArtistAnalyticsResponse:
  type: object
  properties:
    totalPlays:
      type: integer
      minimum: 0
      example: 1520
    totalReposts:
      type: integer
      minimum: 0
      example: 84
    totalDownloads:
      type: integer
      minimum: 0
      example: 12
    totalLikes:
      type: integer
      minimum: 0
      example: 640
    totalComments:
      type: integer
      minimum: 0
      example: 310
  required:
    - totalPlays
    - totalReposts
    - totalDownloads
    - totalLikes
    - totalComments
