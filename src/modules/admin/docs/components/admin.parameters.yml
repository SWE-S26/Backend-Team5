AdminUserIdParam:
  name: userId
  in: path
  required: true
  description: The unique identifier of the user.
  schema:
    type: string
    example: 'usr_001'

AdminTrackIdParam:
  name: trackId
  in: path
  required: true
  description: The unique identifier of the track.
  schema:
    type: string
    example: 'trk_456'

AdminReportIdParam:
  name: reportId
  in: path
  required: true
  description: The unique identifier of the report.
  schema:
    type: string
    example: 'rep_123'

AdminOffsetParam:
  name: offset
  in: query
  required: false
  description: 1-based offset page index. Use 1 for the first page.
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 1

AdminLimitParam:
  name: limit
  in: query
  required: false
  description: Number of results to return.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    example: 20

AdminUserRoleParam:
  name: role
  in: query
  required: false
  description: Filter users by role.
  schema:
    type: string
    enum:
      - Listener
      - Artist
      - Pro
      - Admin
    example: Artist

AdminSuspendedParam:
  name: suspended
  in: query
  required: false
  description: Filter by suspension status.
  schema:
    type: boolean
    example: false

AdminUserSearchQueryParam:
  name: query
  in: query
  required: false
  description: Case-insensitive text search on user displayName or email.
  schema:
    type: string
    example: john

AdminMediaSearchQueryParam:
  name: query
  in: query
  required: false
  description: Case-insensitive text search on track title or artist name.
  schema:
    type: string
    example: vibes

AdminReportStatusParam:
  name: status
  in: query
  required: false
  description: Filter reports by status.
  schema:
    type: string
    enum:
      - pending
      - done
    example: pending

AdminReportTypeParam:
  name: type
  in: query
  required: false
  description: Filter reports by violator type.
  schema:
    type: string
    enum:
      - user
      - track
    example: track
