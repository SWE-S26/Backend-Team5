# 400 Bad Request
BadRequest:
  description: The request could not be processed due to invalid syntax, malformed JSON, missing required fields, or invalid parameter values.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: Invalid request. Please check your parameters and request body.
            
InvalidParameters:
  description: A required parameter is missing or payload is invalid
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Validation failed'
          errors:
            type: array
            items:
              type: object
              properties:
                field:
                  type: string
                  example: 'email'
                message:
                  type: string
                  example: 'Email is required'

# 401 Unauthorized
Unauthorized:
  description: Authorization token required or invalid
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Authorization failed'


# 403 Forbidden
Forbidden:
  description: Not enough permissions to access this resource
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Not enough permissions to access this resource'


# 404 Not Found
NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Property not found or not updated'


# 410 Gone
Gone:
  description: The requested resource is no longer available
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Link is expired'

# 500 Internal Server Error
ServerError:
  description: Internal server error
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Internal server error'

# 503 Service Unavailable
ServiceUnavailable:
  description: Service unavailable
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Service unavailable'
