# 400 Bad Request
BadRequest:
  description: Bad request due to invalid parameters or payload
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'WHAT DID YOU DO!!!!?!?!?!??'
            
InvalidParameters:
  description: A required parameter is missing or payload is invalid
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Validation failed'
          errors:
            type: array
            items:
              type: object
              properties:
                field:
                  type: string
                  example: 'email'
                message:
                  type: string
                  example: 'Email is required'

# 401 Unauthorized
Unauthorized:
  description: Authorization token required or invalid
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: false
          message:
            type: string
            example: 'Authorization failed'
          data:
            nullable: true
            type: object

# 403 Forbidden
Forbidden:
  description: Not enough permissions to access this resource
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: false
          message:
            type: string
            example: 'Not enough permissions to access this resource'
          data:
            nullable: true
            type: object

# 404 Not Found
NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: false
          message:
            type: string
            example: 'Property not found or not updated'
          data:
            nullable: true
            type: object

# 410 Gone
Gone:
  description: The requested resource is no longer available
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: false
          message:
            type: string
            example: 'Link is expired'

# 500 Internal Server Error
ServerError:
  description: Internal server error
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: false
          message:
            type: string
            example: 'Internal server error'
          data:
            nullable: true
            type: object

# 503 Service Unavailable
ServiceUnavailable:
  description: Service unavailable
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: false
          message:
            type: string
            example: 'Service unavailable'
          data:
            nullable: true
            type: object
