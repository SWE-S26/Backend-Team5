IdPathParam:
  name: id
  in: path
  required: true
  description: Resource unique identifier
  schema:
    $ref: "#/components/schemas/Id"

PageQueryParam:
  name: page
  in: query
  required: false
  description: Page number
  schema:
    type: integer
    minimum: 1
    example: 1

LimitQueryParam:
  name: limit
  in: query
  required: false
  description: Number of items per page
  schema:
    type: integer
    minimum: 1
    example: 20
