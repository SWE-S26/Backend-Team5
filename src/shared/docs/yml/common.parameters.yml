IdPathParam:
  name: id
  in: path
  required: true
  description: Resource unique identifier
  schema:
    $ref: '#/components/schemas/Id'

limit:
  name: limit
  in: query
  required: false
  description: Number of items per page
  schema:
    type: integer
    minimum: 1
    example: 20

offset:
  name: offset
  in: query
  required: false
  description: Number of items to skip before starting to collect the result set
  schema:
    type: integer
    minimum: 0
    example: 0
