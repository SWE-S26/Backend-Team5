name: Build and Deploy Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/swe-s26/backend-team5:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        env:
          PORT: ${{ secrets.PORT }}
          MODE: ${{ secrets.MODE }}
          HOST_URL: ${{ secrets.HOST_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_JWT_SECRET: ${{ secrets.REFRESH_JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PUBLITO_KEY: ${{ secrets.PUBLITO_KEY }}
          PUBLITO_SECRET: ${{ secrets.PUBLITO_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NODE_MAILER_HOST: ${{ secrets.NODE_MAILER_HOST }}
          NODE_MAILER_USER: ${{ secrets.NODE_MAILER_USER }}
          NODE_MAILER_PASS: ${{ secrets.NODE_MAILER_PASS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          USE_REDIS: ${{ secrets.USE_REDIS }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          REDIRECT_PARAM_SECRET: ${{ secrets.REDIRECT_PARAM_SECRET }}
          REDIRECT_PARAM_SALT: ${{ secrets.REDIRECT_PARAM_SALT }}
        with:
          host: ${{ secrets.VM_IP }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          envs: PORT,MODE,HOST_URL,JWT_SECRET,REFRESH_JWT_SECRET,MONGO_URI,REDIS_URL,PUBLITO_KEY,PUBLITO_SECRET,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,STRIPE_PUBLIC_KEY,STRIPE_SECRET_KEY,NODE_MAILER_HOST,NODE_MAILER_USER,NODE_MAILER_PASS,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,LOG_LEVEL,USE_REDIS,REDIRECT_PARAM_SECRET,REDIRECT_PARAM_SALT
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            {
                echo "PORT=${PORT}"
                echo "MODE=${MODE}"
                echo "HOST_URL=${HOST_URL}"
                echo "JWT_SECRET=${JWT_SECRET}"
                echo "REFRESH_JWT_SECRET=${REFRESH_JWT_SECRET}"
                echo "MONGO_URI=${MONGO_URI}"
                echo "REDIS_URL=${REDIS_URL}"
                echo "PUBLITO_KEY=${PUBLITO_KEY}"
                echo "PUBLITO_SECRET=${PUBLITO_SECRET}"
                echo "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
                echo "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}"
                echo "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}"
                echo "STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}"
                echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
                echo "NODE_MAILER_HOST=${NODE_MAILER_HOST}"
                echo "NODE_MAILER_USER=${NODE_MAILER_USER}"
                echo "NODE_MAILER_PASS=${NODE_MAILER_PASS}"
                echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
                echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
                echo "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}"
                echo "USE_REDIS=${USE_REDIS}"
                echo "LOG_LEVEL=${LOG_LEVEL}"
                echo "REDIRECT_PARAM_SECRET=${REDIRECT_PARAM_SECRET}"
                echo "REDIRECT_PARAM_SALT=${REDIRECT_PARAM_SALT}"
            } > ~/beatza/.env.backend

            cd ~/beatza
            docker pull ghcr.io/swe-s26/backend-team5:latest
            docker compose up -d --no-deps --force-recreate backend

            docker image prune -f
